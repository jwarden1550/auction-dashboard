<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auction Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--panel:#080a08;--panel-2:#0d100d;--line:#1e241e;--line-soft:#161b16;
  --green:#7CFF4F;--green-dim:#4e9c33;--gold:#C9A227;--gold-dim:#8a7020;
  --text:#ffffff;--muted:#ffffff;--red:#ff5c5c;--red-dim:#5a2020;--blue:#5cc8ff;--blue-dim:#1d4459;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--display:"Archivo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px}
body{min-height:100vh;padding:22px 26px 46px}
button{font-family:var(--mono);cursor:pointer}
::selection{background:var(--green);color:#000}

.top{display:flex;align-items:flex-start;gap:20px}
.mark{width:104px;height:auto;flex:0 0 104px;margin-top:4px;display:block;cursor:pointer}
.mark:hover{opacity:.85}
.titlewrap{flex:1;min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1.04;margin:2px 0 8px;letter-spacing:-.5px}
h1 .g{color:var(--green)}
.sub{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:0 0 8px}
.meta{color:var(--muted);font-size:13px;white-space:nowrap;padding-top:6px;text-align:right}
.meta b{color:var(--text);font-weight:500}

.tabs{display:flex;margin-top:26px;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between}
.tab{background:none;border:0;color:var(--muted);padding:12px 22px;font-size:15px;letter-spacing:2px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--green);border-bottom-color:var(--green)}
.tab .count{color:var(--text);margin-left:8px}
.tab.on .count{color:var(--green)}
.tabtools{display:flex;gap:8px;padding-bottom:8px;align-items:center}
.pulled{color:var(--muted);opacity:.62;font-size:11px;letter-spacing:.6px;white-space:nowrap;margin-right:4px}

.card{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);letter-spacing:2px;font-size:13px;flex-wrap:wrap}
.card-h .hint{color:var(--muted);letter-spacing:1.5px;font-size:12px}
.card-b{padding:18px 16px}

input,select,textarea{background:#000;border:1px solid var(--line);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green-dim)}
input::placeholder,textarea::placeholder{color:#ffffff;opacity:.45}
textarea{width:100%;min-height:190px;font-size:12.5px;line-height:1.6;resize:vertical}
.btn{background:var(--green);color:#04140a;border:0;border-radius:7px;padding:10px 16px;font-size:12.5px;font-weight:700;letter-spacing:1.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:400}
.btn.ghost:hover{border-color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;line-height:1.7}
.hidden{display:none!important}

/* date fields — the browser's own calendar, made visible against the dark panel.
   color-scheme:dark also gives the dropdown itself a dark palette. */
input[type="date"]{color-scheme:dark;cursor:pointer;padding-right:10px}
input[type="date"]::-webkit-calendar-picker-indicator{
  filter:invert(1);opacity:.55;cursor:pointer;padding:2px;margin-left:6px}
input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1}
input[type="date"]:focus::-webkit-calendar-picker-indicator{opacity:1}
input[type="date"]::-webkit-datetime-edit{color:var(--text)}
input[type="date"]:invalid::-webkit-datetime-edit,
input[type="date"]:not(:valid)::-webkit-datetime-edit{opacity:.45}

/* search bar */
.searchbar{display:flex;gap:10px;align-items:center;margin:22px 0 18px;flex-wrap:wrap}
.searchbar input{flex:1;min-width:240px;font-size:15px;padding:14px 16px;border-color:var(--green-dim)}
.searchbar input:focus{box-shadow:0 0 0 1px var(--green),0 0 18px rgba(124,255,79,.12)}

/* totals */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.tot{background:var(--panel-2);padding:15px 16px}
.tot .k{color:var(--muted);font-size:11.5px;letter-spacing:1.8px;margin-bottom:8px}
.tot .v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.tot .v.green{color:var(--green)}.tot .v.gold{color:var(--gold)}.tot .v.red{color:var(--red)}
.tot .s{color:var(--muted);font-size:11.5px;margin-top:7px}

#tbl th{cursor:pointer}
#lowTbl th{cursor:pointer}

#lowTbl tbody tr{cursor:pointer}
.tot.click{cursor:pointer;transition:background .15s}
.tot.click:hover{background:#12160f}
.tot.click .k:after{content:" ▸";color:var(--green)}


/* category table */
#catTbl td.catname{font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
#catTbl td.strong{font-family:var(--display);font-weight:700;font-size:16px}
#catTbl tbody tr{cursor:pointer}

/* detail */
.crumb{display:flex;align-items:center;gap:14px;margin:22px 0 18px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);font-size:17px;line-height:1;flex:0 0 40px}
.back:hover{border-color:var(--green);color:var(--green)}
.crumb h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0;display:flex;align-items:center;gap:12px}
.crumb .q{color:var(--muted);font-size:12.5px;letter-spacing:1.5px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tscroll{overflow:auto;max-height:min(72vh,900px)}
thead th{position:sticky;top:0;z-index:5;background:#0b0d0b;box-shadow:inset 0 -1px 0 var(--line)}
th{text-align:right;color:var(--muted);font-weight:500;letter-spacing:1.5px;font-size:11.5px;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,th:nth-child(2){text-align:left}
th:hover{color:var(--text)}
th .ar{color:var(--green)}
td{padding:13px 16px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child,td:nth-child(2){text-align:left}
tbody tr:hover{background:#0e120e}
tfoot td{border-top:1px solid var(--line);border-bottom:0;color:var(--text);font-weight:700;background:var(--panel-2)}
tfoot td{position:sticky;bottom:0;z-index:4;background:#0d100d}
.pk{font-family:var(--display);font-weight:700;font-size:15px}
.doi-cell{font-family:var(--display);font-weight:700;font-size:15px;border-radius:5px;padding:5px 10px;display:inline-block;min-width:56px;text-align:center}
.d-crit{background:rgba(255,92,92,.22);color:#ff8a8a;box-shadow:inset 0 0 0 1px var(--red-dim)}
.d-low{background:rgba(201,162,39,.18);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-dim)}
.d-ok{background:rgba(124,255,79,.12);color:var(--green);box-shadow:inset 0 0 0 1px var(--green-dim)}
.d-over{background:rgba(92,200,255,.14);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue-dim)}
.d-none{background:none;color:var(--muted);box-shadow:none;opacity:.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;letter-spacing:1px;align-items:center}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.orline{display:flex;align-items:center;gap:14px;color:var(--muted);letter-spacing:2px;font-size:12px}
.orline:before,.orline:after{content:"";height:1px;background:var(--line);flex:1}
.minifilter{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11px;letter-spacing:1.5px}
.minifilter select,.minifilter input{min-width:200px}
.pills{display:flex;gap:10px;margin:22px 0 0;flex-wrap:wrap}
.pill-btn{display:inline-flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:11px 20px;font-size:13px;letter-spacing:2px}
.pill-btn:hover{border-color:var(--muted);color:var(--text)}
.pill-btn .pd{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pill-btn b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:0;color:var(--muted)}
.pill-btn.on{border-color:var(--green);color:var(--green);background:rgba(124,255,79,.07)}
.pill-btn.on .pd{background:var(--green);box-shadow:0 0 8px var(--green)}
.pill-btn.on b{color:var(--text)}
#sheetResult table{font-size:12.5px}
#sheetResult td,#sheetResult th{padding:8px 12px}
.sheetrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.sheetrow label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11.5px;letter-spacing:1.5px}
.sheetrow label:first-child{flex:1;min-width:280px}
.sheetrow input{color:var(--text)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:4px 10px;font-size:11.5px;letter-spacing:1.2px;color:var(--muted);margin:2px 4px 2px 0}
.chip.s1{color:var(--blue);border-color:var(--blue-dim)}
.chip.s2{color:var(--gold);border-color:var(--gold-dim)}
.chip.s3{color:var(--green);border-color:var(--green-dim)}
.chip.bad{color:var(--red);border-color:var(--red-dim)}
.age{font-family:var(--display);font-weight:700}
#inTbl th,#wipTbl th,#dupTbl th,#aucTbl th{cursor:pointer}
#dupTbl td.wrapcell{max-width:260px}
td.thumb{padding:6px 10px;width:52px}
img.slab{width:38px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#111;cursor:zoom-in;display:block}
img.slab:hover{border-color:var(--green)}
#whTbl a,#dupTbl a,#aucTbl a{color:var(--green);text-decoration:none;border-bottom:1px solid transparent}
#whTbl a:hover,#dupTbl a:hover,#aucTbl a:hover{border-bottom-color:var(--green)}
a{color:var(--green)}
a.openlink{display:inline-block;width:38px;height:52px;line-height:52px;text-align:center;border:1px solid var(--line);border-radius:4px;color:var(--green);text-decoration:none}
a.openlink:hover{border-color:var(--green)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:80;cursor:zoom-out;padding:40px}
.lightbox.on{display:flex}
.lightbox img{max-width:min(560px,90vw);max-height:90vh;border-radius:10px;border:1px solid var(--line)}
#whTbl th{cursor:pointer}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 18px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11px;letter-spacing:1.5px;position:relative}
.filters .wrap{position:relative;display:block}
.filters .wrap input,.filters .wrap textarea{padding-right:30px}
.fclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);
  font-size:15px;line-height:1;padding:4px 6px;border-radius:4px;display:none;opacity:.7}
.fclear:hover{color:var(--red);opacity:1;background:#161b16}
.filters .wrap.filled .fclear{display:block}
.filters input,.filters select,.filters textarea{width:100%}
.msel{position:relative}
.mselbtn{width:100%;text-align:left;background:#000;border:1px solid var(--line);border-radius:7px;
  color:var(--muted);font-family:var(--mono);font-size:13px;letter-spacing:0;text-transform:none;
  padding:10px 26px 10px 13px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mselbtn:after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.mselbtn:hover{border-color:var(--muted)}
.mselbtn.has{color:var(--green);border-color:var(--green-dim)}
.mselpanel{display:none;position:fixed;z-index:90;width:300px;background:#0b0d0b;border:1px solid var(--line);
  border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.6);padding:8px;
  font-family:var(--mono);font-size:13px;letter-spacing:0;text-transform:none;text-align:left;color:var(--text)}
.mselpanel.open{display:block}
.mselempty{color:var(--muted);padding:10px;line-height:1.6}
.mselpicked{display:none;flex-wrap:wrap;gap:6px;margin-top:6px}
.mselchip{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--mono);font-size:13px;letter-spacing:0;line-height:1.3;padding:6px 10px;border-radius:6px;
  background:rgba(124,255,79,.10);border:1px solid var(--green-dim);color:var(--text);
  max-width:100%;white-space:normal;text-align:left}
.mselchip .x{color:var(--green);font-size:13px;opacity:.8;flex:0 0 auto}
.mselchip:hover{border-color:var(--red);background:rgba(255,92,92,.10)}
.mselchip:hover .x{color:var(--red);opacity:1}
.mselsearch{width:100%;margin-bottom:6px}

.mselopts{max-height:260px;overflow:auto}
.mselopt{display:flex;flex-direction:row;align-items:center;gap:9px;padding:7px 8px;border-radius:5px;cursor:pointer}
.mselopt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mselopt:hover{background:#12160f}
.mselopt input{width:14px;height:14px;accent-color:#7CFF4F;flex:0 0 14px;margin:0}
.mselopt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mselfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;margin-top:6px;border-top:1px solid var(--line)}
.filters textarea{min-height:38px;height:38px;resize:vertical;padding:10px 13px;font-size:13px;line-height:1.3}
.filters textarea:focus{height:88px}
.filters .fbtns{display:flex;gap:8px;grid-column:1/-1}
#dupTbl td.wrapcell{white-space:normal;max-width:340px;font-family:var(--display);font-weight:600}
#inTbl td.wrapcell,#wipTbl td.wrapcell,#fgTbl td.wrapcell{white-space:normal;max-width:300px}
#inTbl tbody tr[data-po],#wipTbl tbody tr[data-po],#fgTbl tbody tr[data-po]{cursor:pointer}
.polink{color:var(--green);border-bottom:1px solid transparent}
tr:hover .polink{border-bottom-color:var(--green)}
#poBody table th{cursor:default;font-size:11px}
#poBody table td{padding:9px 12px}
#poBody tr.drill{cursor:pointer}
#poBody .chev{display:inline-block;width:16px;color:var(--muted);transition:transform .12s}
#poBody tr.drill:hover .chev{color:var(--green)}
#poBody tr.drill.open .chev{transform:rotate(90deg);color:var(--green)}
#poBody tr.drill:hover{background:#0e120e}
#poBody tr.drill.open{background:#0e120e}
#poBody tr.drilldown td{background:#0b0e0b;border-left:2px solid var(--green-dim)}
#inTbl a,#wipTbl a{color:var(--green);text-decoration:none;border-bottom:1px solid var(--green-dim)}
#inTbl a:hover,#wipTbl a:hover{border-bottom-color:var(--green)}
.chip.s3{margin:2px 0}
#inTbl th:hover,#wipTbl th:hover,#dupTbl th:hover,#whTbl th:hover,#tbl th:hover,#fgTbl th:hover,#lowTbl th:hover{color:var(--green)}
.selcol{width:64px;line-height:1.5;text-align:center!important;padding-left:12px!important;padding-right:6px!important}
.selcol input{width:15px;height:15px;accent-color:#7CFF4F;cursor:pointer}
.selbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);
  background:rgba(124,255,79,.06)}
.selbar b{font-family:var(--display);font-size:15px}
.pgbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line)}
.pg{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 12px;font-size:12.5px}
.pg:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.pg.on{border-color:var(--green);color:var(--green);background:rgba(124,255,79,.08)}
.pg:disabled{opacity:.35}
.pgdots{color:var(--muted);padding:0 4px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(18px);background:var(--green);color:#04140a;padding:12px 22px;border-radius:8px;font-size:13px;letter-spacing:1px;opacity:0;pointer-events:none;transition:.18s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- auction dashboard additions ---------- */
.sec{display:inline-block;padding:2px 7px;border:1px solid var(--line);font-size:10.5px;letter-spacing:1px}
/* A sport reads as a colour before it reads as a word, which is the point of
   a column you scan rather than read. Shape borrowed from .sec; the colour
   itself is set per row, since the list of sports is the data's to decide. */
.sport{display:inline-block;padding:2px 8px;border:1px solid;border-radius:4px;
  font-size:10.5px;letter-spacing:1px;white-space:nowrap}
.sec.shoebox{color:var(--gold);border-color:var(--gold-dim)}
.sec.auctions{color:var(--green);border-color:var(--green-dim)}
.soon{color:var(--red)}
.colbtn{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);
  font-size:12px;letter-spacing:1.5px;padding:8px 15px;border-radius:7px;cursor:pointer}
.colbtn:hover{color:var(--text);border-color:var(--muted)}
.pills{display:flex;gap:8px}
.pill-btn b{margin-left:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:13px 15px}
.kpi .k{font-size:10.5px;letter-spacing:1.6px;color:var(--muted);opacity:.72}
.kpi .v{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.12;margin-top:5px;letter-spacing:-.5px}
.kpi .s{font-size:11.5px;color:var(--muted);opacity:.72;margin-top:3px}
.kpi.good .v{color:var(--green)} .kpi.bad .v{color:var(--red)} .kpi.gold .v{color:var(--gold)}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:9px 8px;align-items:end}
/* Scoped to DIRECT children. Unscoped, these reached inside the .mselpanel —
   which is a DOM descendant even though it renders fixed — and beat the
   panel's own rules on specificity: "label{display:block}" stacked each
   checkbox above its text, and "input{width:100%}" blew the checkboxes up
   into full-width boxes. */
.fgrid>div>label{display:block;font-size:10px;letter-spacing:1.2px;color:var(--muted);opacity:.72;margin-bottom:4px}
.fgrid>div>input,.fgrid>div>select,.fgrid>div>.pair>input{width:100%;background:var(--panel-2);
  border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:12.5px;padding:7px 9px}
.fgrid>div>input:focus,.fgrid>div>select:focus,.fgrid>div>.pair>input:focus{outline:none;border-color:var(--green-dim)}
/* the panel's search box styled explicitly, since it no longer inherits the above */
.mselpanel .mselsearch{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);font-size:12.5px;padding:7px 9px;border-radius:5px}
.mselpanel .mselsearch:focus{outline:none;border-color:var(--green-dim)}
/* and the option rows, hardened against anything reaching in again */
.mselpanel .mselopt{display:flex;flex-direction:row;align-items:center;gap:9px;margin:0;font-size:12.5px;
  letter-spacing:0;color:var(--text);opacity:1}
.mselpanel .mselopt input[type="checkbox"]{width:14px;height:14px;flex:0 0 14px;padding:0;margin:0;
  background:none;border:0;accent-color:var(--green)}
/* the multi-selects are replaced by one-line .msel buttons, so they only
   remain in the DOM as the value store */
.fgrid select[multiple]{display:none}
.card-b.filters{padding:12px 14px}

/* ---------- filter builder ---------- */
.card-h .hbtns{display:flex;gap:8px;align-items:center}
.colbtn.on{color:var(--green);border-color:var(--green-dim)}
.fcount{display:inline-block;margin-left:7px;background:var(--green);color:#000;
  border-radius:999px;padding:0 7px;font-size:11px;line-height:17px;min-width:17px;text-align:center}
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.fchip{display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;
  font-size:11px;letter-spacing:.5px;color:var(--text)}
.fchip button{background:none;border:none;color:var(--muted);opacity:.55;cursor:pointer;
  font-size:14px;line-height:1;padding:0 4px;font-family:var(--mono)}
.fchip button:hover{opacity:1;color:var(--red)}
.fchip.clear{padding:4px 11px;letter-spacing:1.2px;color:var(--muted);opacity:.7;cursor:pointer;
  background:none;font-family:var(--mono);font-size:10px}
.fchip.clear:hover{opacity:1;color:var(--red);border-color:var(--red-dim)}

/* ---------- column picker: drag to reorder ---------- */
.colrow{position:relative;user-select:none}
.colrow.dragging{opacity:.45;background:rgba(124,255,79,.07);border:1px dashed var(--green-dim)}
.colrow .grip{color:var(--muted);opacity:.35;cursor:grab;font-size:13px;line-height:1;letter-spacing:-1px}
.colrow:hover .grip{opacity:.8}
.colrow .grip:active{cursor:grabbing}
.cpick{display:flex;align-items:center;gap:9px;flex:1;min-width:0;cursor:pointer;margin:0}
.cpick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* kept visible rather than revealed on hover: on a list you are rearranging,
   a control you have to go looking for is a control you do not know is there */
.colrow .mv{display:flex;gap:2px;opacity:.4;transition:opacity .12s}
.colrow:hover .mv,.colrow:focus-within .mv{opacity:1}
.colrow .mv button{background:none;border:1px solid var(--line);color:var(--muted);
  font-family:var(--mono);font-size:10px;line-height:1;padding:3px 5px;border-radius:4px;cursor:pointer}
.colrow .mv button:hover{color:var(--green);border-color:var(--green-dim)}

.fpanel{position:fixed;left:50%;top:8vh;transform:translateX(-50%);width:min(880px,94vw);
  max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:16px 18px 14px;z-index:200;box-shadow:0 26px 70px rgba(0,0,0,.7)}
.fphead{display:flex;justify-content:space-between;align-items:center;gap:12px;
  letter-spacing:2px;font-size:12px;padding-bottom:12px;margin-bottom:13px;
  border-bottom:1px solid var(--line)}
.fbadge{color:var(--green);letter-spacing:1.2px;font-size:11px;margin-left:6px}
.fclearall{background:none;border:none;color:var(--muted);opacity:.6;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:1.2px}
.fclearall:hover{opacity:1;color:var(--red)}
.frow{display:flex;gap:7px;align-items:center;margin-bottom:7px;flex-wrap:nowrap}
.frow select,.frow input{background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);font-size:12px;padding:7px 9px;border-radius:6px;min-width:0}
.frow select:focus,.frow input:focus{outline:none;border-color:var(--green-dim)}
.frow .ffield{flex:0 0 186px}
.frow .fop{flex:0 0 152px;color:var(--muted)}
.frow .fval{flex:1 1 90px}
.frow .ghostval{flex:1 1 90px;border:none;background:none;padding:0}
.fjoin{flex:0 0 68px;color:var(--muted);opacity:.62;font-size:11px;letter-spacing:1.3px;
  padding-left:2px}
.fconj{flex:0 0 68px}
.fand{color:var(--muted);opacity:.55;font-size:11px;letter-spacing:1px}
.fx{background:none;border:none;color:var(--muted);opacity:.45;cursor:pointer;
  font-size:16px;line-height:1;padding:0 4px;font-family:var(--mono)}
.fx:hover{opacity:1;color:var(--red)}
.fgroupbox{position:relative;border:1px dashed var(--line);border-radius:8px;
  padding:10px 10px 4px;margin:0 0 8px;background:rgba(124,255,79,.02)}
.fgroupbox .gl{position:absolute;top:-10px;left:12px;background:var(--panel);padding:0 6px;flex:none}
.fgroupbox select.gl{top:-14px;padding:3px 6px}
.fgroupbox .gx{position:absolute;top:4px;right:4px}
.fgroupbox .fgroup{padding-top:4px}
.fadds{margin:2px 0 4px}
.fadd{background:none;border:none;color:var(--green);font-family:var(--mono);font-size:11px;
  letter-spacing:1.2px;cursor:pointer;padding:5px 0;margin-right:18px}
.fadd.alt{color:var(--blue)}
.fadd:hover{text-decoration:underline}
.fpfoot{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);
  padding-top:13px;margin-top:9px}
@media(max-width:720px){
  .frow{flex-wrap:wrap}
  .frow .ffield,.frow .fop{flex:1 1 140px}
}
.card-h .tog{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);
  font-size:10px;letter-spacing:1.2px;padding:3px 9px;border-radius:5px}
.card-h .tog:hover{color:var(--text);border-color:var(--muted)}
.card-h .active{color:var(--green);letter-spacing:1.2px;font-size:11px}
.pair{display:flex;gap:6px}

.tscroll{overflow:auto;max-height:70vh;border:1px solid var(--line);background:var(--panel)}
#lotTbl,#brkTbl,#pipeTbl{width:100%;border-collapse:collapse;font-size:12.5px}
#lotTbl th,#brkTbl th,#pipeTbl th{position:sticky;top:0;z-index:2;background:var(--panel-2);border-bottom:1px solid var(--line);
  padding:9px 11px;text-align:center;font-size:10.5px;letter-spacing:1.3px;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
/* The sort arrow is appended to the label, so centring the text alone would
   shift the label left every time a column is sorted. The cell centres its
   contents as a unit instead, and the arrow hangs off the end. */
#lotTbl th .ar,#brkTbl th .ar,#pipeTbl th .ar{position:absolute;margin-left:4px}
#lotTbl th:hover,#brkTbl th:hover,#pipeTbl th:hover{color:var(--green)}
#lotTbl th .ar,#brkTbl th .ar,#pipeTbl th .ar{color:var(--green)}
#lotTbl td,#brkTbl td,#pipeTbl td{padding:8px 11px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
#lotTbl tbody tr:hover,#brkTbl tbody tr:hover,#pipeTbl tbody tr:hover{background:var(--panel-2)}
#lotTbl td.num,#brkTbl td.num,#pipeTbl td.num{text-align:right;font-variant-numeric:tabular-nums}
#lotTbl td.wrap,#brkTbl td.wrap,#pipeTbl td.wrap{white-space:normal;min-width:190px;max-width:330px}
.thumb{width:34px;height:46px;object-fit:cover;background:var(--panel-2);border:1px solid var(--line);display:block;cursor:zoom-in}
.pos{color:var(--green)} .neg{color:var(--red)}
/* With every column switched on these tables run past 4,500px. Pin the
   identity column so you can still tell which lot a cell belongs to after
   scrolling right. */
#lotTbl td.stick,#pipeTbl td.stick{position:sticky;left:0;z-index:2;background:var(--panel)}
#lotTbl tbody tr:hover td.stick,#pipeTbl tbody tr:hover td.stick{background:var(--panel-2)}
#lotTbl th.stick,#pipeTbl th.stick{position:sticky;left:0;z-index:4;background:var(--panel-2)}
#lotTbl td.stick,#pipeTbl td.stick,#lotTbl th.stick,#pipeTbl th.stick{box-shadow:1px 0 0 var(--line)}
.alink{color:var(--blue);text-decoration:none} .alink:hover{text-decoration:underline}
.bar{height:3px;background:var(--line);margin-top:20px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--green);animation:sl 1.1s infinite ease-in-out}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.err{border:1px solid var(--red-dim);background:#1a0c0c;color:var(--red);padding:11px 13px;font-size:12.5px;margin-top:14px}

/* ---------- loading, said out loud ----------
   #msg sits below every tab's content, so a bar drawn into it was off the
   bottom of the screen on the one occasion anybody wanted to see it. This
   rides above the page instead, in the middle of it, where it is the thing
   being looked at while there is nothing else to look at. */
.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:300;
  width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px 13px;box-shadow:0 16px 44px rgba(0,0,0,.65)}
.loading .lhead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  font-size:11.5px;letter-spacing:1.1px;color:var(--muted);margin-bottom:9px}
.loading .lwhat{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading .lleft{flex:0 0 auto;color:var(--green);font-variant-numeric:tabular-nums}
.loading .lleft.over{color:var(--gold)}
.ltrack{height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.ltrack i{display:block;height:100%;width:30%;background:var(--green);animation:sl 1.1s infinite ease-in-out}
.ltrack u{display:block;height:100%;background:var(--green);transition:width .3s linear}
</style>

<script>
/* Arena Auctions — standalone dashboard.
   Data comes from /api/auction, the same open-column endpoint the Buying
   Inventory app uses: whatever the Metabase question returns is what the
   table shows. Locally there is no serverless runtime and no Metabase key,
   so we read the deployed endpoint instead — it sends CORS for any origin. */
const LOCAL = ["localhost","127.0.0.1","[::1]",""].includes(location.hostname);
const API = LOCAL ? "https://buying-inventory.vercel.app/api/auction" : "/api/auction";
const BUILD = "2026-09-29a";

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>Number(n||0).toLocaleString();
const usd=n=>(n<0?"-":"")+"$"+Math.abs(Number(n||0)).toLocaleString(undefined,{maximumFractionDigits:0});
/* Table money rounds to whole dollars, matching buying-inventory, which
   renders "$"+fmt(Math.round(v)). The underlying values are identical in both
   apps — only the display differs. Because rounding hides cents (a $2.31 cost
   next to a $7 sale reads as a 71% margin when the true figure is 67%), any
   cell carrying cents gets a tooltip with the exact amount. MARGIN % and
   PROFIT $ are always computed from the unrounded values. */
const usdc=n=>(n<0?"-":"")+"$"+Math.round(Math.abs(Number(n||0))).toLocaleString("en-US");
const exactTip=n=>{const v=Number(n||0);return v%1?` title="exactly ${v<0?"-":""}$${Math.abs(v).toFixed(2)}"`:"";};
const pct=n=>n===null||n===undefined||isNaN(n)?"—":(n>0?"+":"")+Number(n).toFixed(1)+"%";
const pct2=n=>n===null||n===undefined||isNaN(n)?"—":Number(n).toFixed(1)+"%";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 9/30/26. Pinned to en-US so the order stays month-first rather than
   following the viewer's locale, which would render 30/09/26 in much of
   the world. */
const day=v=>{const t=Date.parse(v);return isNaN(t)?"—":new Date(t).toLocaleDateString("en-US",{month:"numeric",day:"numeric",year:"2-digit"});};

const stamp=v=>{
  const t=Date.parse(v); if(isNaN(t)) return "";
  return "data pulled "+new Date(t).toLocaleString("en-US",
    {month:"numeric",day:"numeric",year:"2-digit",hour:"numeric",minute:"2-digit"});
};
const S={page:1,sort:"SOLD_AT",dir:"desc",rows:[],meta:null,book:null,view:null};

/* the columns worth showing, in order — anything else the question adds
   still filters and exports, it just doesn't crowd the table */
/* When the function runs past its ceiling, Vercel answers with an HTML error
   page, and asking JSON.parse what it makes of "An error occurred…" produced
   the unexplained "Unexpected token 'A'" readers were seeing. Every response
   goes through here, so a failure says what happened and what to do. */
async function readJson(r){
  const text=await r.text();
  try{ return JSON.parse(text); }
  catch(_){
    const why = r.status===504 || /FUNCTION_INVOCATION_TIMEOUT/.test(text)
      ? "the data source took too long to answer — try REFRESH in a minute, it is usually quick once warm"
      : r.status>=500 ? `the endpoint failed (HTTP ${r.status})`
      : `the endpoint answered with something that is not data (HTTP ${r.status})`;
    throw new Error(why);
  }
}

/* The four biggest sports get the four most separated hues, so the column
   reads at a glance; the rest fan out from there. Theme green and red are
   deliberately absent — in these tables they mean profit and loss, and a
   sport should not borrow that. Anything not listed takes a stable colour
   from its own name, so a sport added tomorrow is consistently itself rather
   than falling back to grey. */
const SPORT_COLOR={
  football:"#5CC8FF", basketball:"#FF9B42", pokemon:"#FFD93D", baseball:"#FF6FA5",
  soccer:"#6FE39B", one_piece:"#C792EA", wrestling:"#E8663D", hockey:"#9BD1FF",
  combat:"#D4584F", boxing:"#B5705C", racing:"#4DD6C1", golf:"#A3D977",
  tennis:"#D8E84A", marvel:"#FF5C8A", star_wars:"#9FA8DA",
  garbage_pail_kids:"#8FBF7F", media:"#AAB4BF", other:"#7F8A96"
};
function sportColor(v){
  const k=String(v||"").trim().toLowerCase();
  if(!k) return null;
  if(SPORT_COLOR[k]) return SPORT_COLOR[k];
  let h=0;
  for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))%360;
  return `hsl(${h},62%,68%)`;
}
/* one colour per sport, used at 14% for the fill and 45% for the border */
function sportCell(v){
  const c=sportColor(v);
  if(!c) return '<td>—</td>';
  return `<td><span class="sport" style="color:${c};border-color:color-mix(in srgb,${c} 45%,transparent);`+
    `background:color-mix(in srgb,${c} 14%,transparent)">${esc(v)}</span></td>`;
}

const COLS=[
  {k:"FRONT_SLAB_PICTURE_URL",t:"",     kind:"img",  nosort:true},
  {k:"PLAYER_NAME",  t:"PLAYER",        kind:"wrap"},
  {k:"SET_NAME",     t:"SET",           kind:"wrap"},
  {k:"SPORT",        t:"SPORT",        kind:"sport"},
  {k:"GRADE",        t:"GRADE"},
  {k:"PREMIER_BLOCK",t:"BLOCK",         kind:"block", nosort:true, always:true},
  {k:"SOLD_AT",      t:"SOLD",          kind:"date"},
  /* Ordered as the money moves: the three figures we know, then the three
     derived from them. Each derived column sits next to what it is made of —
     VS. EV after SOLD PRICE and EST VALUE, PROFIT after SOLD PRICE and
     PURCHASE COST, MARGIN % straight after PROFIT. */
  {k:"PURCHASE_COST",t:"PURCHASE COST", kind:"usd"},
  {k:"ESTIMATED_VALUE",t:"EST VALUE",   kind:"usd"},
  {k:"SOLD_PRICE",   t:"SOLD PRICE",    kind:"usd"},
  {k:"SOLD_VS_EV",   t:"SOLD PRICE VS. EV", kind:"signed"},
  {k:"MARGIN",       t:"PROFIT $",      kind:"signed"},
  {k:"MARGIN_PCT",   t:"MARGIN %",      kind:"marginpct", nosort:true, always:true},
  {k:"TOTAL_BIDS",   t:"BIDS",          kind:"int"},
  {k:"TAG",          t:"TAG"},
  {k:"INSERT",       t:"INSERT",        kind:"wrap"},
  {k:"YEAR",         t:"YEAR",          always:true},
  {k:"GRADING_COMPANY",t:"GRADER",      always:true},
  {k:"IS_ROOKIE",    t:"ROOKIE",        kind:"bool", always:true},
  {k:"PUBLIC_URL",   t:"VIEW",          kind:"viewcalc", nosort:true, always:true},
  {k:"CARD_URL",     t:"ADMIN",         kind:"admin", nosort:true}
];

/* ================= FILTER BUILDER =================
   One rule builder serves both tables. It replaces the fixed filter grids,
   which could only ask the questions they had boxes for: a row is
   field · operator · value, rows can be grouped, and groups join with AND or
   OR. Everything is evaluated here in the browser over the whole book, so a
   rule sees all 3,000-odd lots rather than the hundred currently on screen —
   which is why both tabs now load their book up front instead of a page at a
   time. */

/* Label and type for the fields worth filtering on. Anything the endpoint
   returns that is missing here still appears, typed by looking at its values;
   this map is for the ones where the name or the type is not obvious. */
const FMETA={
  PLAYER_NAME:{l:"Player name"}, SET_NAME:{l:"Set name"}, SPORT:{l:"Sport"},
  GRADE:{l:"Grade"}, TAG:{l:"Tag"}, INSERT:{l:"Insert"}, INSERT_NAME:{l:"Insert"},
  PARALLEL_NAME:{l:"Parallel"}, PARALLEL_NUMBER:{l:"Parallel #",t:"num"},
  PARALLEL_TOTAL:{l:"Parallel /total",t:"num"}, TEAM:{l:"Team"},
  SLAB_TYPE:{l:"Slab type"}, RARITY:{l:"Rarity"}, LANGUAGE:{l:"Language"},
  EDITION:{l:"Edition"}, GRADING_COMPANY:{l:"Grading company"},
  YEAR:{l:"Year",t:"num"}, CARD_NUMBER:{l:"Card #",t:"text"},
  AC_NUMBER:{l:"AC #",t:"num"}, "8ac_number":{l:"AC #",t:"num"},
  CERT_NUMBER:{l:"Cert #",t:"text"}, PO_NUMBER:{l:"PO number",t:"text"},
  NUMBER:{l:"Lot #",t:"num"},
  IS_ROOKIE:{l:"Is rookie",t:"bool"}, IS_RELIC:{l:"Is relic",t:"bool"},
  IS_FULL_ART:{l:"Is full art",t:"bool"}, IS_SHOEBOX:{l:"Is shoebox",t:"bool"},
  COLLECTION:{l:"Section"}, PREMIER_BLOCK:{l:"Block"}, AUCTION_STATUS:{l:"Status"},
  ITEM_CATEGORY:{l:"Category"}, COST_KIND:{l:"Cost source"},
  ESTIMATED_VALUE:{l:"Est value",t:"usd"}, PURCHASE_COST:{l:"Purchase cost",t:"usd"},
  SOLD_PRICE:{l:"Sold price",t:"usd"}, SOLD_VS_EV:{l:"Sold price vs. EV",t:"usd"},
  MARGIN:{l:"Profit $",t:"usd"}, CURRENT_BID:{l:"Current bid",t:"usd"},
  START_PRICE:{l:"Start price",t:"usd"}, RESERVE:{l:"Reserve",t:"usd"},
  TOTAL_BIDS:{l:"Bids",t:"num"}, PAST_AUCTIONS:{l:"Prior runs",t:"num"},
  COMP_AGE_DAYS:{l:"Days since last comp",t:"num"}, HOURS_LEFT:{l:"Hours left",t:"num"},
  SOLD_AT:{l:"Sold date",t:"date"}, START_AT:{l:"Start date",t:"date"},
  END_AT:{l:"Close date",t:"date"}, LAST_COMPED:{l:"Last comped",t:"date"},
  BRAND:{l:"Brand"}, MODEL:{l:"Model"}, REFERENCE:{l:"Reference"}, CONDITION:{l:"Condition"},
  ITEM_STATUS:{l:"Item status"}
};
/* ids, image and link columns — nothing you would ever filter on */
const FHIDE=/^(FRONT_SLAB_PICTURE_URL|PUBLIC_URL|ADMIN_URL|CARD_URL|AUCTION_URL|AUCTION_ID|ITEM_ID|COST_BUY_ORDER_ID|COST_ROW_COUNT)$/;
/* completed rows carry the AC number as 8ac_number and pick AC_NUMBER up
   again from /api/cardattrs, which put the same field in the list twice under
   the same name. Where both are present the one on the row itself wins. */
const FBEATEN={AC_NUMBER:"8ac_number"};

/* Columns the table works out per row rather than reading off it. They are
   computed on demand so nothing is written back onto the row — the export
   still ships exactly the fields the endpoint sent. `need` lists the raw
   fields each one is made of, which is also how a scope decides whether to
   offer it. */
const FDERIVED={
  MARGIN_PCT:{l:"Margin %",t:"pct",need:["SOLD_PRICE","PURCHASE_COST"],
    f:r=>{const sp=numv(r.SOLD_PRICE); return sp?((sp-numv(r.PURCHASE_COST))/sp)*100:null;}},
  PL_AT_BID:{l:"P/L @ bid",t:"usd",need:["CURRENT_BID","PURCHASE_COST"],
    f:r=>{const b=numv(r.CURRENT_BID); return b?b-numv(r.PURCHASE_COST):null;}},
  MARGIN_AT_BID:{l:"Margin @ bid",t:"pct",need:["CURRENT_BID","PURCHASE_COST"],
    f:r=>{const b=numv(r.CURRENT_BID); return b?((b-numv(r.PURCHASE_COST))/b)*100:null;}},
  /* only where nothing has sold yet — a completed lot has SOLD PRICE VS. EV
     and MARGIN % for the same job, measured against what it really made */
  MARGIN_AT_EV:{l:"Margin @ EV",t:"pct",need:["ESTIMATED_VALUE","PURCHASE_COST"],not:["SOLD_PRICE"],
    f:r=>{const e=numv(r.ESTIMATED_VALUE); return e?((e-numv(r.PURCHASE_COST))/e)*100:null;}},
  /* completed lots carry no block column; the block is looked up by auction
     id the same way the BLOCK cell does, so filtering and the table agree */
  PREMIER_BLOCK:{l:"Block",t:"text",need:["AUCTION_URL"],
    f:r=>{const id=auctionIdOf(r); return (id&&PREMIER&&PREMIER[id])||"standard";}}
};
const fval=(r,k)=>{
  const d=FDERIVED[k];
  if(d && r[k]===undefined) return d.f(r);
  return r[k];
};

const FOPS={
  text:[["has","includes"],["!has","does not include"],["is","is"],["!is","is not"],
        ["any","is any of (csv)"],["none","is none of (csv)"],
        ["empty","is empty"],["!empty","is not empty"]],
  num:[["=","="],["!=","is not"],[">","greater than"],[">=","at least"],
       ["<","less than"],["<=","at most"],["btw","between"],
       ["empty","is empty"],["!empty","is not empty"]],
  date:[["on","is"],["before","is before"],["after","is after"],["btw","is between"],
        ["last","is in the last"],["empty","is empty"],["!empty","is not empty"]],
  bool:[["true","is true"],["false","is false"]]
};
const opsFor=t=>FOPS[t==="usd"||t==="pct"?"num":t]||FOPS.text;
/* the two operators whose box holds a list rather than one value */
const isCsv=o=>o==="any"||o==="none";
const isNumT=t=>t==="num"||t==="usd"||t==="pct";

/* how many value boxes an operator needs */
const opArity=o=>o==="empty"||o==="!empty"||o==="true"||o==="false"?0:o==="btw"?2:1;

function ftype(k,rows){
  const m=FMETA[k]; if(m&&m.t) return m.t;
  let seen=0,num=0,bool=0,date=0;
  for(let i=0;i<rows.length&&seen<150;i++){
    const v=rows[i][k];
    if(v===null||v===undefined||v==="") continue;
    seen++;
    if(typeof v==="boolean"){ bool++; continue; }
    if(typeof v==="number"||/^-?\d+(\.\d+)?$/.test(String(v).trim())) num++;
    else if(/^\d{4}-\d{2}-\d{2}[T ]/.test(String(v))) date++;
  }
  if(!seen) return "text";
  if(bool===seen) return "bool";
  if(date===seen) return "date";
  if(num===seen) return "num";
  return "text";
}

/* The field list a scope offers, plus the distinct values behind each text
   field so the value box can suggest what is actually in the data. */
const FSCOPE={};
function buildFields(scope,cols,rows){
  const seen={},out=[];
  (cols||[]).forEach(k=>{
    if(!k||FHIDE.test(k)||seen[k]) return;
    if(FBEATEN[k]&&(cols||[]).includes(FBEATEN[k])) return;
    seen[k]=1;
    out.push({k,l:(FMETA[k]||{}).l||niceName(k),t:ftype(k,rows)});
  });
  Object.keys(FDERIVED).forEach(k=>{
    if(seen[k]) return;
    const d=FDERIVED[k];
    if(!d.need.every(n=>(cols||[]).includes(n))) return;
    if((d.not||[]).some(n=>(cols||[]).includes(n))) return;
    seen[k]=1; out.push({k,l:d.l,t:d.t});
  });
  out.sort((a,b)=>a.l.localeCompare(b.l));
  const vals={};
  out.filter(f=>f.t==="text").forEach(f=>{
    const s=new Set();
    for(let i=0;i<rows.length&&s.size<400;i++){
      const v=fval(rows[i],f.k);
      if(v!==null&&v!==undefined&&String(v).trim()!=="") s.add(String(v));
    }
    if(s.size&&s.size<=400) vals[f.k]=[...s].sort((a,b)=>a.localeCompare(b));
  });
  FSCOPE[scope]={fields:out,vals,byKey:Object.fromEntries(out.map(f=>[f.k,f]))};
  return FSCOPE[scope];
}

/* A datalist matches on the whole box, so once a csv operator has a comma in
   it the suggestions would be hunting for "football, soc". Rebuilding them
   with what is already typed as the prefix keeps them offering the next
   value — and one value on its own still works, which is the point of these
   two: the same operator reads a single name or a list of them. */
function csvSuggest(input, vals){
  const dl=document.getElementById(input.getAttribute("list"));
  if(!dl||!vals) return;
  const cut=input.value.lastIndexOf(",");
  const head=cut<0?"":input.value.slice(0,cut+1)+" ";
  const taken=head.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
  dl.innerHTML=vals.filter(v=>!taken.includes(v.toLowerCase())).slice(0,400)
    .map(v=>`<option value="${esc(head+v)}">`).join("");
}

/* ---------- the rule tree ---------- */
const FRULES={};
const FKEY=scope=>"auctiondash.rules."+scope;
function rulesFor(scope){
  if(FRULES[scope]) return FRULES[scope];
  let t=null;
  try{ const raw=localStorage.getItem(FKEY(scope)); if(raw) t=JSON.parse(raw); }catch(_){}
  if(!t||t.k!=="g") t={k:"g",op:"and",items:[]};
  const GONE={sw:"has",anyhas:"any"};
  (function walk(nd){ (nd.items||[]).forEach(c=>{
    if(c.k==="g") walk(c); else if(GONE[c.o]) c.o=GONE[c.o];
  }); })(t);
  FRULES[scope]=t; return t;
}
function saveRules(scope){
  try{ localStorage.setItem(FKEY(scope),JSON.stringify(rulesFor(scope))); }catch(_){}
}
const newRule=()=>({k:"r",f:"",o:"",t:"text",v:"",v2:""});
/* a rule counts as live once it has a field and whatever value its operator
   needs — half-typed rows must not silently empty the table */
const liveRule=r=>!!r.f&&!!r.o&&(opArity(r.o)===0||String(r.v||"").trim()!==""||String(r.v2||"").trim()!=="");
function countRules(node){
  if(node.k!=="g") return liveRule(node)?1:0;
  return (node.items||[]).reduce((a,c)=>a+countRules(c),0);
}

function ruleHit(r,rule){
  const t=rule.t||"text",o=rule.o;
  const raw=fval(r,rule.f);
  const blank=raw===null||raw===undefined||String(raw).trim()==="";
  if(o==="empty") return blank;
  if(o==="!empty") return !blank;
  if(t==="bool"){
    const b=raw===true||raw==="true"||raw===1||raw==="1";
    return o==="true"?b:!b;
  }
  if(t==="date"){
    if(blank) return false;
    const ts=Date.parse(raw); if(isNaN(ts)) return false;
    if(o==="last"){ const n=Number(rule.v); return !n||ts>=Date.now()-n*864e5; }
    const d=new Date(ts), day=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
    const toDay=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||"")); return m?(+m[1])*10000+(+m[2])*100+(+m[3]):null; };
    const a=toDay(rule.v),b2=toDay(rule.v2);
    if(o==="on") return a!==null&&day===a;
    if(o==="before") return a!==null&&day<a;
    if(o==="after") return a!==null&&day>a;
    if(o==="btw") return (a===null||day>=a)&&(b2===null||day<=b2);
    return true;
  }
  if(isNumT(t)){
    if(blank) return false;
    const n=numv(raw);
    const a=String(rule.v||"").trim()===""?null:Number(rule.v);
    const b2=String(rule.v2||"").trim()===""?null:Number(rule.v2);
    switch(o){
      case "=":   return a===null||n===a;
      case "!=":  return a===null||n!==a;
      case ">":   return a!==null&&n>a;
      case ">=":  return a!==null&&n>=a;
      case "<":   return a!==null&&n<a;
      case "<=":  return a!==null&&n<=a;
      case "btw": return (a===null||n>=a)&&(b2===null||n<=b2);
    }
    return true;
  }
  const s=String(raw==null?"":raw).toLowerCase();
  const q=String(rule.v==null?"":rule.v).trim().toLowerCase();
  if(!q) return true;
  const list=()=>q.split(",").map(x=>x.trim()).filter(Boolean);
  switch(o){
    case "has":    return s.includes(q);
    case "!has":   return !s.includes(q);
    case "is":     return s===q;
    case "!is":    return s!==q;
    case "any":    return list().some(x=>s===x);
    case "none":   return !list().some(x=>s===x);
  }
  return true;
}
function nodeHit(r,node){
  if(node.k!=="g") return liveRule(node)?ruleHit(r,node):true;
  const kids=(node.items||[]).filter(c=>c.k==="g"?countRules(c):liveRule(c));
  if(!kids.length) return true;
  return node.op==="or"?kids.some(c=>nodeHit(r,c)):kids.every(c=>nodeHit(r,c));
}
const filterRows=(rows,scope)=>{
  const t=rulesFor(scope);
  return countRules(t)?rows.filter(r=>nodeHit(r,t)):rows;
};

/* ---------- the panel ---------- */
function ruleText(scope,rule){
  const sc=FSCOPE[scope]||{byKey:{}};
  const f=sc.byKey[rule.f];
  const op=(opsFor(rule.t).find(o=>o[0]===rule.o)||["",rule.o])[1];
  const val=opArity(rule.o)===0?"":opArity(rule.o)===2
    ? `${rule.v||"…"} – ${rule.v2||"…"}`
    : (rule.o==="last"?`${rule.v} days`:rule.v);
  return `${(f&&f.l)||rule.f} ${op}${val?" "+val:""}`;
}
function chipsHtml(scope){
  const t=rulesFor(scope),out=[];
  const walk=(n,path)=>{
    (n.items||[]).forEach((c,i)=>{
      const p=path.concat(i);
      if(c.k==="g") walk(c,p);
      else if(liveRule(c)) out.push(`<span class="fchip">${esc(ruleText(scope,c))}
        <button data-path="${p.join(".")}" title="remove">×</button></span>`);
    });
  };
  walk(t,[]);
  if(!out.length) return "";
  return out.join("")+`<button class="fchip clear" data-clearall="1">CLEAR ALL</button>`;
}
function dropPath(scope,path){
  const idx=path.split(".").map(Number);
  let n=rulesFor(scope);
  for(let i=0;i<idx.length-1;i++) n=n.items[idx[i]];
  n.items.splice(idx[idx.length-1],1);
  saveRules(scope);
}

function openFilterPanel(scope,title,onApply){
  const sc=FSCOPE[scope]||{fields:[],vals:{},byKey:{}};
  const root=rulesFor(scope);
  const snapshot=JSON.stringify(root);

  const shade=document.createElement("div");
  shade.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:199";
  const wrap=document.createElement("div");
  wrap.className="fpanel";
  document.body.appendChild(shade); document.body.appendChild(wrap);
  const close=()=>{ wrap.remove(); shade.remove(); document.removeEventListener("keydown",onKey); };
  const cancel=()=>{ FRULES[scope]=JSON.parse(snapshot); close(); };
  const onKey=e=>{ if(e.key==="Escape") cancel(); };
  document.addEventListener("keydown",onKey);
  shade.onclick=cancel;

  const optList=(opts,sel)=>opts.map(([v,l])=>
    `<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`).join("");

  function rowHtml(rule,path,i,group){
    const f=sc.byKey[rule.f];
    const t=f?f.t:(rule.t||"text");
    const ops=opsFor(t);
    const join=i===0
      ? `<span class="fjoin">Where</span>`
      : i===1
        ? `<select class="fconj" data-conj="${path.slice(0,-1).join(".")}">
             <option value="and" ${group.op!=="or"?"selected":""}>And</option>
             <option value="or" ${group.op==="or"?"selected":""}>Or</option></select>`
        : `<span class="fjoin">${group.op==="or"?"Or":"And"}</span>`;
    const n=opArity(rule.o);
    const listId="fl_"+path.join("_");
    const box=(which,val)=>{
      if(t==="date"&&rule.o!=="last") return `<input class="fval" type="date" data-v="${which}" data-path="${path.join(".")}" value="${esc(val||"")}">`;
      if(isNumT(t)||rule.o==="last") return `<input class="fval" type="number" step="any" data-v="${which}" data-path="${path.join(".")}" value="${esc(val||"")}" placeholder="${rule.o==="last"?"days":which==="v2"?"max":"value…"}">`;
      const dl=sc.vals[rule.f], csv=isCsv(rule.o);
      return `<input class="fval" data-v="${which}" data-path="${path.join(".")}" value="${esc(val||"")}"
        placeholder="${csv?"value, value, value…":"value…"}" spellcheck="false" ${dl?`list="${listId}"`:""}>
        ${dl?`<datalist id="${listId}">${dl.slice(0,400).map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`:""}`;
    };
    return `<div class="frow">
      ${join}
      <select class="ffield" data-field="${path.join(".")}">
        <option value="">choose a field…</option>
        ${sc.fields.map(x=>`<option value="${esc(x.k)}" ${x.k===rule.f?"selected":""}>${esc(x.l)}</option>`).join("")}
      </select>
      <select class="fop" data-op="${path.join(".")}" ${rule.f?"":"disabled"}>${optList(ops,rule.o)}</select>
      ${n>=1?box("v",rule.v):""}
      ${n===2?`<span class="fand">and</span>`+box("v2",rule.v2):""}
      ${n===0?`<span class="fval ghostval"></span>`:""}
      <button class="fx" data-del="${path.join(".")}" title="remove">×</button>
    </div>`;
  }
  function groupHtml(node,path){
    const inner=(node.items||[]).map((c,i)=>c.k==="g"
      ? `<div class="fgroupbox">
           ${i===0?`<span class="fjoin gl">Where</span>`:i===1
             ? `<select class="fconj gl" data-conj="${path.join(".")}">
                  <option value="and" ${node.op!=="or"?"selected":""}>And</option>
                  <option value="or" ${node.op==="or"?"selected":""}>Or</option></select>`
             : `<span class="fjoin gl">${node.op==="or"?"Or":"And"}</span>`}
           <button class="fx gx" data-del="${path.concat(i).join(".")}" title="remove group">×</button>
           ${groupHtml(c,path.concat(i))}
         </div>`
      : rowHtml(c,path.concat(i),i,node)).join("");
    return `<div class="fgroup">${inner||`<p class="note" style="margin:2px 0 8px">No filters yet — every lot shows.</p>`}
      <div class="fadds">
        <button class="fadd" data-addrule="${path.join(".")}">+ Add filter</button>
        <button class="fadd alt" data-addgroup="${path.join(".")}">+ Add group</button>
      </div></div>`;
  }
  const at=p=>{ let n=root; (p===""?[]:p.split(".").map(Number)).forEach(i=>{n=n.items[i];}); return n; };

  /* the "N active" count, without rebuilding the rows under the cursor */
  function badge(){
    const n=countRules(root), el=wrap.querySelector(".fbadge");
    if(el) el.textContent=n?n+" active":"";
  }
  function draw(){
    const n=countRules(root);
    wrap.innerHTML=`<div class="fphead">
        <span>FILTER ${esc(title)} <span class="fbadge">${n?n+" active":""}</span></span>
        <button class="fclearall" data-act="clear">Clear all</button>
      </div>
      ${groupHtml(root,[])}
      <div class="fpfoot">
        <button class="btn ghost" data-act="cancel">CANCEL</button>
        <button class="btn" data-act="apply">APPLY</button>
      </div>`;

    wrap.querySelectorAll("[data-addrule]").forEach(b=>b.onclick=()=>{
      at(b.dataset.addrule).items.push(newRule()); draw();
    });
    wrap.querySelectorAll("[data-addgroup]").forEach(b=>b.onclick=()=>{
      at(b.dataset.addgroup).items.push({k:"g",op:"and",items:[newRule()]}); draw();
    });
    wrap.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      const p=b.dataset.del.split(".").map(Number);
      const parent=at(p.slice(0,-1).join("."));
      parent.items.splice(p[p.length-1],1); draw();
    });
    wrap.querySelectorAll("[data-conj]").forEach(s=>s.onchange=()=>{
      at(s.dataset.conj).op=s.value; draw();
    });
    wrap.querySelectorAll("[data-field]").forEach(s=>s.onchange=()=>{
      const r=at(s.dataset.field);
      r.f=s.value;
      const f=sc.byKey[r.f];
      r.t=f?f.t:"text";
      r.o=opsFor(r.t)[0][0];        // first operator for the new type
      r.v=""; r.v2=""; draw();
    });
    wrap.querySelectorAll("[data-op]").forEach(s=>s.onchange=()=>{
      const r=at(s.dataset.op), was=r.o;
      r.o=s.value;
      if(opArity(r.o)===0){ r.v=""; r.v2=""; }
      /* redraw only when the row changes shape — the number of value boxes,
         or a date switching between a calendar and a count of days */
      const shape=o=>opArity(o)+":"+(o==="last");
      if(shape(was)!==shape(r.o)) draw(); else badge();
    });
    /* value boxes update the model as you type and never redraw — a redraw
       here would take the caret with it */
    wrap.querySelectorAll("[data-v]").forEach(i=>{
      i.oninput=()=>{
        const r=at(i.dataset.path);
        r[i.dataset.v]=i.value; badge();
        if(isCsv(r.o)) csvSuggest(i, sc.vals[r.f]);
      };
      i.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); apply(); } };
    });
    wrap.querySelector("[data-act='clear']").onclick=()=>{ root.items=[]; draw(); };
    wrap.querySelector("[data-act='cancel']").onclick=cancel;
    wrap.querySelector("[data-act='apply']").onclick=apply;
  }
  function apply(){
    /* drop rows that were opened and left blank rather than keep dead UI */
    const prune=n=>{
      n.items=(n.items||[]).filter(c=>c.k==="g"?(prune(c),(c.items||[]).length):liveRule(c));
      return n;
    };
    prune(root); saveRules(scope); close(); onApply();
  }
  draw();
}

/* FILTER button, its count, and the chip row under the table head */
function syncFilterUI(scope,btnId,chipId,onApply){
  const btn=$(btnId),box=$(chipId);
  const n=countRules(rulesFor(scope));
  if(btn){
    const b=btn.querySelector(".fcount");
    if(b){ b.textContent=n; b.classList.toggle("hidden",!n); }
    btn.classList.toggle("on",!!n);
  }
  if(box){
    box.innerHTML=chipsHtml(scope);
    box.classList.toggle("hidden",!n);
    box.querySelectorAll("[data-path]").forEach(b=>b.onclick=()=>{
      dropPath(scope,b.dataset.path); onApply();
    });
    const ca=box.querySelector("[data-clearall]");
    if(ca) ca.onclick=()=>{ rulesFor(scope).items=[]; saveRules(scope); onApply(); };
  }
}

/* ---------- loading, with an estimate from experience ----------
   An honest estimate can only come from how long this has taken before, so
   every finished load is timed and kept. The median of the last five is what
   the countdown runs on; before there is any history it says so rather than
   inventing a number, and once a load runs past its estimate it stops
   counting down and admits it. */
const LOADMS_KEY="auctiondash.loadms";
const loadStats=()=>{ try{ return JSON.parse(localStorage.getItem(LOADMS_KEY))||{}; }catch(_){ return {}; } };
function recordLoad(key,ms){
  try{
    const all=loadStats();
    all[key]=(all[key]||[]).concat(Math.round(ms)).slice(-5);
    localStorage.setItem(LOADMS_KEY,JSON.stringify(all));
  }catch(_){}
}
function estimateFor(key){
  const list=loadStats()[key]||[];
  if(!list.length) return null;
  const sorted=[...list].sort((a,b)=>a-b);
  return sorted[Math.floor(sorted.length/2)];
}
const secs=ms=>Math.max(1,Math.round(ms/1000));

let LOADBOX=null;
function startLoad(key,label){
  endLoad(null,false);                       // only ever one on screen
  const box=document.createElement("div");
  box.className="loading";
  document.body.appendChild(box);
  const job={key,label,note:label,est:estimateFor(key),at:Date.now(),box,timer:null};
  job.draw=()=>{
    const ms=Date.now()-job.at;
    let right, bar;
    if(!job.est){
      right = ms>1200 ? secs(ms)+"s" : "";
      bar = '<i></i>';
    }else if(ms<job.est){
      right = "about "+secs(job.est-ms)+"s left";
      bar = `<u style="width:${Math.min(97,(ms/job.est)*100).toFixed(1)}%"></u>`;
    }else{
      right = "longer than usual · "+secs(ms)+"s";
      bar = '<i></i>';
    }
    job.box.innerHTML=`<div class="lhead"><span class="lwhat">${esc(job.note)}</span>`+
      `<span class="lleft${job.est&&ms>=job.est?" over":""}">${esc(right)}</span></div>`+
      `<div class="ltrack">${bar}</div>`;
  };
  job.say=t=>{ job.note=t; job.draw(); };
  job.draw();
  job.timer=setInterval(job.draw,250);
  LOADBOX=job;
  return job;
}
function endLoad(job,ok){
  const j = job || LOADBOX;
  if(!j) return;
  clearInterval(j.timer);
  if(ok!==false) recordLoad(j.key, Date.now()-j.at);
  if(j.box&&j.box.parentNode) j.box.remove();
  if(LOADBOX===j) LOADBOX=null;
}

/* ---------- loading the book ---------- */
/* REFRESH was firing a request but getting the same snapshot back: the
   function caches for minutes and the CDN in front of it longer, so a plain
   re-request could only return what was already held. This flag makes the
   next load ask the function to skip its cache, and the timestamp carries a
   cache-buster so no CDN or browser copy can answer instead. */
let FORCE_FRESH=false;
const freshen=q=>{ if(FORCE_FRESH){ q.set("fresh","1"); q.set("_",String(Date.now())); } return q; };
/* The whole book, once. The builder asks questions the endpoint has no
   parameters for, so the filtering happens here — which only tells the truth
   if everything is here. The first request says how many pages there are and
   the rest go out together, rather than one after another. */
/* Twelve requests for the book was the slow part, and not because of their
   size: the endpoint loads the whole question on every call, so twelve at
   once meant twelve cold functions each pulling all 11,811 rows and building
   every facet before answering. Four thousand rows a page makes it three,
   and the first goes on its own so the two behind it meet a warm cache
   instead of racing it. */
const BOOKPAGE=4000;
/* Every page of an endpoint, merged. The first request says how many there
   are; the rest go out together rather than one after another. */
async function bookPages(url, extra){
  const get=async(off,slim)=>{
    const p=new URLSearchParams(extra||"");
    p.set("limit",String(BOOKPAGE)); p.set("offset",String(off));
    /* every page recomputed the facets and the totals over all 11,811 rows
       and shipped them back; only the first one is ever read */
    if(slim) p.set("slim","1");
    const r=await fetch(url+"?"+freshen(p).toString());
    const b=await readJson(r);
    if(!b.ok) throw new Error(b.error||"the endpoint returned no data");
    return b;
  };
  const first=await get(0,false);
  const pages=Math.max(1,first.pages||1);
  let done=1;
  if(LOADBOX&&pages>1) LOADBOX.say(`Reading the whole book — ${fmt(first.total||0)} lots, page 1 of ${pages}`);
  const rest=await Promise.all(Array.from({length:pages-1},(_,i)=>
    get((i+1)*BOOKPAGE,true).then(b=>{
      done++;
      if(LOADBOX) LOADBOX.say(`Reading the whole book — page ${done} of ${pages}`);
      return b;
    })));
  const rows=(first.rows||[]).slice();
  rest.forEach(b=>rows.push(...(b.rows||[])));
  return {rows,columns:first.columns||[],generated:first.generated};
}

/* The book is 11,811 lots — about ten megabytes — so it is not something to
   drag down just to show the first hundred. Unfiltered, the table pages off
   the endpoint the way it always has. A rule is a question about every lot,
   so asking one fetches the book, once, and everything after that (filter,
   sort, page, breakdown, export) is answered from it without another
   request. */
async function ensureBook(){
  if(S.book) return S.book;
  /* the book exists to answer rules, and a rule can ask about any of the
     attribute fields, so this one does wait for them */
  const [book]=await Promise.all([bookPages(API),premierBlocks(),costFixes(),cardAttrs()]);
  applyCostFixes(book.rows); applyCardAttrs(book.rows);
  S.book=book;
  buildFields("lots",book.columns.concat(EXTRA_CARD_FIELDS),book.rows);
  return book;
}

async function load(){
  if(S.book){ applyLots(); return; }          // nothing to wait for
  const wantBook = countRules(rulesFor("lots"));
  const key = wantBook ? "lots:book" : "lots:page";
  const job = startLoad(key, wantBook ? "Reading the whole book" : "Loading Auctions");
  try{
    if(wantBook) await ensureBook();
    if(S.book) applyLots(); else await loadPage();
    endLoad(job);
  }catch(e){
    endLoad(job,false);
    $("#msg").innerHTML='<div class="err">Could not load auctions — '+esc(e.message)+'</div>';
  }
}

/* one page, straight off the endpoint, with its own totals */
async function loadPage(){
  const p=new URLSearchParams();
  p.set("limit","100"); p.set("offset",String((S.page-1)*100));
  p.set("sort",S.sort); p.set("dir",S.dir);
  const r=await fetch(API+"?"+freshen(p).toString());
  const b=await readJson(r);
  if(!b.ok) throw new Error(b.error||"the endpoint returned no data");
  /* Cost corrections and the block names are small and change what the money
     columns say, so the table waits for them. Card attributes are 1.7 MB and
     have taken 19 seconds — the table used to sit behind that before drawing
     a single row. It draws first now and they land into it. */
  await Promise.all([premierBlocks(),costFixes()]);
  applyCostFixes(b.rows);
  if(CARDATTRS) applyCardAttrs(b.rows);
  S.rows=b.rows; S.meta=b; S.view=null;
  buildFields("lots",(b.columns||[]).concat(EXTRA_CARD_FIELDS),b.rows);
  syncFilterUI("lots","#lotFilt","#lotChips",()=>{S.page=1;load();});
  renderKpis(b); renderTable(b);
  fillInCardAttrs();
}

/* The attribute columns — year, grader, rookie, team, parallel, the rest —
   arrive after the table is already up, so they are filled into what is on
   screen rather than held in front of it. Redraws only if the page that
   asked is still the page being looked at. */
function fillInCardAttrs(){
  if(CARDATTRS) return;
  const was=S.meta;
  cardAttrs().then(()=>{
    if(S.meta!==was) return;          // moved on; that page fills its own
    applyCardAttrs(S.rows);
    renderTable(S.meta);
  }).catch(()=>{});
}

/* filter, sort and page the book already in the browser */
function applyLots(){
  const book=S.book; if(!book) return;
  const rows=sortRows(filterRows(book.rows,"lots"),S.sort,S.dir);
  const pages=Math.max(1,Math.ceil(rows.length/100));
  if(S.page>pages) S.page=pages;
  const b={ok:true,rows:rows.slice((S.page-1)*100,S.page*100),columns:book.columns,
    matched:rows.length,total:book.rows.length,pages,
    totals:totalsJS(rows),totals_all:totalsJS(book.rows),generated:book.generated};
  S.rows=b.rows; S.meta=b; S.view=rows;
  syncFilterUI("lots","#lotFilt","#lotChips",()=>{S.page=1;load();});
  renderKpis(b); renderTable(b);
}

/* The same arithmetic api/auction.js does on the server, moved here because
   the rows it has to total are now chosen here. Cost counts on every lot;
   sold, profit, margin and EV count only on lots that actually sold. */
function totalsJS(rows){
  const has=(r,c)=>r[c]!==null&&r[c]!==undefined&&String(r[c]).trim()!=="";
  let cost=0,sold=0,soldCount=0,costOfSold=0,evOfSold=0;
  rows.forEach(r=>{
    if(has(r,"PURCHASE_COST")) cost+=numv(r.PURCHASE_COST);
    if(has(r,"SOLD_PRICE")&&numv(r.SOLD_PRICE)!==0){
      sold+=numv(r.SOLD_PRICE); soldCount++;
      if(has(r,"PURCHASE_COST")) costOfSold+=numv(r.PURCHASE_COST);
      if(has(r,"ESTIMATED_VALUE")) evOfSold+=numv(r.ESTIMATED_VALUE);
    }
  });
  const profit=sold-costOfSold;
  return {lots:rows.length,cards:rows.length,cost,sold,sold_count:soldCount,
    cost_of_sold:costOfSold,profit,
    margin:sold?(profit/sold)*100:null,
    ev_of_sold:evOfSold,
    sold_to_ev:evOfSold?(sold/evOfSold)*100:null};
}

/* Sorting moved in with the filtering. Blanks sort last whichever way the
   column is pointed — a column of em-dashes on top of page one told you
   nothing. */
function sortRows(rows,key,dir){
  if(!key) return rows;
  const d=dir==="asc"?1:-1;
  let probe=null;
  for(let i=0;i<rows.length&&probe===null;i++){
    const v=fval(rows[i],key);
    if(v!==null&&v!==undefined&&v!=="") probe=v;
  }
  const isDate=typeof probe==="string"&&/^\d{4}-\d{2}-\d{2}[T ]/.test(probe);
  const isNum=!isDate&&(typeof probe==="number"||
    (probe!==null&&!isNaN(parseFloat(String(probe).replace(/[$,\s]/g,"")))));
  return rows.slice().sort((a,b)=>{
    const x=fval(a,key),y=fval(b,key);
    const bx=x===null||x===undefined||x==="",by=y===null||y===undefined||y==="";
    if(bx&&by) return 0;
    if(bx) return 1;
    if(by) return -1;
    if(isDate) return (Date.parse(x)-Date.parse(y))*d;
    if(isNum)  return (numv(x)-numv(y))*d;
    return String(x).localeCompare(String(y))*d;
  });
}

/* ---------- KPIs ---------- */
function renderKpis(b){
  const t=b.totals||{}, a=b.totals_all||{};
  const filtered=(b.matched||0)!==(b.total||0);
  const avgSold=t.sold_count?t.sold/t.sold_count:0;
  const tile=(k,v,s,cls)=>`<div class="kpi ${cls||""}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s||""}</div></div>`;
  $("#kpis").innerHTML=[
    tile("LOTS",fmt(t.lots),filtered?`of ${fmt(a.lots)} in the book`:"the whole book"),
    tile("TOTAL COST",usd(t.cost),"what these lots cost"),
    tile("TOTAL SOLD",usd(t.sold),`${fmt(t.sold_count)} sold`),
    tile("PROFIT",usd(t.profit),"sold minus cost of sold",t.profit>=0?"good":"bad"),
    tile("MARGIN",pct(t.margin),"profit ÷ sold",t.margin>=0?"good":"bad"),
    tile("SOLD ÷ EV",pct2(t.sold_to_ev),"sold vs estimated value",t.sold_to_ev>=100?"good":"bad"),
    tile("AVG SOLD",usd(avgSold),"per lot sold","gold")
  ].join("");
  $("#mGen").textContent=stamp(b.generated);
  $("#lotHead").textContent=`COMPLETED AUCTIONS · ${fmt(b.matched)}`+(filtered?` of ${fmt(b.total)}`:"");
}

/* ---------- table ---------- */
/* The completed-auctions endpoint (Metabase card 39238) emits an
   admin.arenaclub.com/auctions/<id> link, but admin has no /auctions route, so
   it 404s. It has no public URL either, so build the same slug the pipeline
   builds in SQL: <sport>-<set>-<player>-8AC<number padded to 9>. */
const pubUrl=r=>{
  const num=r["8ac_number"];
  if(num===null||num===undefined||num==="") return "";
  const slug=[r.SPORT,r.SET_NAME,r.PLAYER_NAME].map(x=>String(x==null?"":x)).join(" ")
    .replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase();
  if(!slug) return "";
  return "https://arenaclub.com/cards/"+slug+"-8AC"+String(num).padStart(9,"0");
};
/* The fields card 39238 does not select, fetched from /api/cardattrs and
   merged on the card id from CARD_URL. Pulled lazily — only when one of these
   columns is actually switched on — because it is every card the account has
   auctioned, not just the page. */
const EXTRA_CARD_FIELDS=["TEAM","YEAR","GRADING_COMPANY","CARD_NUMBER","AC_NUMBER",
  "PARALLEL_NUMBER","SLAB_TYPE","RARITY","LANGUAGE","EDITION","IS_ROOKIE","IS_RELIC","IS_FULL_ART"];
let CARDATTRS=null;
async function cardAttrs(){
  if(CARDATTRS) return CARDATTRS;
  if(LOCAL){ CARDATTRS={}; return CARDATTRS; }
  try{
    const r=await fetch("/api/cardattrs");
    const b=await readJson(r);
    const map={};
    if(b.ok){
      const idx=b.cols.indexOf("CARD_ID");
      b.rows.forEach(row=>{
        const o={};
        b.cols.forEach((c,i)=>{ if(i!==idx) o[c]=row[i]; });
        map[String(row[idx])]=o;
      });
    }
    CARDATTRS=map;
  }catch(_){ CARDATTRS={}; }
  return CARDATTRS;
}
function applyCardAttrs(rows){
  if(!CARDATTRS) return rows;
  rows.forEach(r=>{
    const a=CARDATTRS[cardIdOf(r)];
    if(a) Object.keys(a).forEach(k=>{ if(r[k]===undefined) r[k]=a[k]; });
  });
  return rows;
}
/* Card 39238 values a lot at its latest cost row even when that row is zero,
   so a few lots arrive costing nothing and reporting a 100% margin. /api/costfix
   returns the corrected cost for exactly those, and they are patched into the
   rows on arrival — so every downstream reader (table, breakdown, export)
   computes from the same cost the pipeline uses, rather than each applying its
   own correction. */
let COSTFIX=null;
async function costFixes(){
  if(COSTFIX) return COSTFIX;
  if(LOCAL){ COSTFIX={}; return COSTFIX; }
  try{
    const r=await fetch("/api/costfix");
    const b=await readJson(r);
    COSTFIX = b.ok ? (b.costs||{}) : {};
  }catch(_){ COSTFIX={}; }
  return COSTFIX;
}
const cardIdOf=r=>{
  const m=String(r.CARD_URL||"").match(/cards\/([0-9a-f-]{36})/i);
  return m?m[1]:null;
};
function applyCostFixes(rows){
  if(!COSTFIX) return rows;
  rows.forEach(r=>{
    const id=cardIdOf(r);
    const fixed=id!=null?COSTFIX[id]:undefined;
    if(fixed===undefined||fixed===null) return;
    r.PURCHASE_COST=fixed;
    r.MARGIN=numv(r.SOLD_PRICE)-fixed;   // the endpoint's MARGIN is profit in dollars
    r.COST_CORRECTED=true;
  });
  return rows;
}

/* COMPLETED AUCTIONS reads Metabase card 39238, which does not expose the
   premier block. It does return AUCTION_URL, which ends in the auction id, so
   the block is joined here from /api/premier — a few hundred rows, fetched
   once. Locally that endpoint does not exist (no serverless runtime), so the
   column simply stays blank rather than erroring. */
let PREMIER=null;
async function premierBlocks(){
  if(PREMIER) return PREMIER;
  if(LOCAL){ PREMIER={}; return PREMIER; }
  try{
    const r=await fetch("/api/premier");
    const b=await readJson(r);
    PREMIER = b.ok ? (b.blocks||{}) : {};
  }catch(_){ PREMIER={}; }
  return PREMIER;
}
const auctionIdOf=r=>{
  const m=String(r.AUCTION_URL||"").match(/auctions\/([0-9a-f-]{36})/i);
  return m?m[1]:null;
};

/* add the sticky class to an already-built <td> */
const stickify=(html,on)=>on?html.replace("<td","<td class=\"stick\"").replace('class="stick" class="','class="stick '):html;

function cell(row,c){
  const v=row[c.k];
  switch(c.kind){
    case "img": return v?`<td><img class="thumb" src="${esc(v)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'" onclick="window.open('${esc(v)}','_blank')"></td>`:`<td></td>`;
    case "block":{
      const id=auctionIdOf(row);
      const name=id&&PREMIER?PREMIER[id]:null;
      return `<td class="wrap">${name?esc(name):"<span style=\"opacity:.45\">standard</span>"}</td>`;
    }
    case "sport": return sportCell(v);
    case "bool":
      return `<td class="num">${v===true||v==="true"?'<span class="pos">✓</span>':""}</td>`;
    case "viewcalc":{
      const u=pubUrl(row);
      return u?`<td><a class="alink" href="${esc(u)}" target="_blank" rel="noopener">VIEW ↗</a></td>`:`<td></td>`;
    }
    case "admin": return v?`<td><a class="alink" style="opacity:.62" href="${esc(v)}" target="_blank" rel="noopener">ADMIN ↗</a></td>`:`<td></td>`;
    case "link": return v?`<td><a class="alink" href="${esc(v)}" target="_blank" rel="noopener">OPEN ↗</a></td>`:`<td></td>`;
    case "wrap": return `<td class="wrap">${esc(v||"—")}</td>`;
    case "date": return `<td class="num">${day(v)}</td>`;
    case "usd":  return v===null||v===undefined||v===""
      ? `<td class="num">—</td>`
      : `<td class="num"${exactTip(v)}>${usdc(v)}</td>`;
    case "int":  return `<td class="num">${v===null||v===undefined||v===""?"—":fmt(v)}</td>`;
    case "signed":{
      if(v===null||v===undefined||v==="") return `<td class="num">—</td>`;
      const n=Number(v);
      return `<td class="num ${n>0?"pos":n<0?"neg":""}"${exactTip(n)}>${usdc(n)}</td>`;
    }
    /* (sold - cost) / sold — margin on revenue. The endpoint's MARGIN column
       is sold minus cost in DOLLARS, so rendering it as a percentage was
       wrong: a lot that cost $2.31 and sold for $7 read "4.7%". Computed here
       from the two figures already on the row. Undefined only if sold price
       is $0, which no completed sale is. */
    case "marginpct":{
      const c=numv(row.PURCHASE_COST), sp=numv(row.SOLD_PRICE);
      if(!sp) return `<td class="num" title="no sold price — a margin is undefined">—</td>`;
      const n=((sp-c)/sp)*100;
      return `<td class="num ${n>0?"pos":n<0?"neg":""}">${pct(n)}</td>`;
    }
    case "pctcell":{
      if(v===null||v===undefined||v==="") return `<td class="num">—</td>`;
      const n=Number(v);
      return `<td class="num ${n>0?"pos":n<0?"neg":""}">${pct(n)}</td>`;
    }
    default: return `<td>${esc(v==null||v===""?"—":v)}</td>`;
  }
}

function renderTable(b){
  const avail=b.columns||[];
  const defs=COLS.filter(c=>c.always||!b.columns||avail.includes(c.k)||c.k==="");
  const cols=visibleCols("completed",defs,avail.concat(EXTRA_CARD_FIELDS));
  /* pinning a column only reads as pinning while it is at the left edge —
     dragged into the middle it would slide over its neighbours instead */
  const stickKey=(cols.slice(0,2).find(c=>c.kind==="wrap")||{}).k;
  $("#lotTbl thead").innerHTML="<tr>"+cols.map(c=>{
    const on=S.sort===c.k;
    const cls=c.k===stickKey?' class="stick"':"";
    return `<th${cls} ${c.nosort?"":`data-k="${c.k}"`}>${esc(c.t)}${on?`<span class="ar">${S.dir==="asc"?"▲":"▼"}</span>`:""}</th>`;
  }).join("")+"</tr>";
  $("#lotTbl tbody").innerHTML=b.rows.length
    ? b.rows.map(r=>"<tr>"+cols.map(c=>stickify(cell(r,c),c.k===stickKey)).join("")+"</tr>").join("")
    : `<tr><td colspan="${cols.length}" style="padding:24px;text-align:center;color:var(--muted)">No lots match these filters.</td></tr>`;
  $$("#lotTbl th[data-k]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(S.sort===k) S.dir=S.dir==="asc"?"desc":"asc"; else { S.sort=k; S.dir="desc"; }
    S.page=1; load();
  });
  pager($("#lotPager"),S.page,b.pages||1,b.matched||0,p=>{S.page=p;load();});
}

function pager(el,page,pages,total,onGo){
  if(!el) return;
  if(pages<=1){ el.innerHTML=`<span class="note">${fmt(total)} row${total===1?"":"s"} · one page</span>`; return; }
  const win=2,out=[];
  const add=p=>out.push(`<button class="pg${p===page?" on":""}" data-p="${p}">${p}</button>`);
  add(1);
  if(page-win>2) out.push(`<span class="pgdots">…</span>`);
  for(let p=Math.max(2,page-win);p<=Math.min(pages-1,page+win);p++) add(p);
  if(page+win<pages-1) out.push(`<span class="pgdots">…</span>`);
  if(pages>1) add(pages);
  el.innerHTML=`<button class="pg" data-p="${Math.max(1,page-1)}" ${page===1?"disabled":""}>‹</button>
    ${out.join("")}
    <button class="pg" data-p="${Math.min(pages,page+1)}" ${page===pages?"disabled":""}>›</button>
    <span class="note" style="margin-left:12px">page ${fmt(page)} of ${fmt(pages)} · ${fmt(total)} rows</span>`;
  el.querySelectorAll(".pg").forEach(btn=>btn.onclick=()=>{
    const p=Number(btn.dataset.p); if(p===page) return;
    onGo(p);
    const box=el.closest(".card").querySelector(".tscroll"); if(box) box.scrollTop=0;
  });
}

   The filtered book is already in the browser, so this is the same rows the
   COMPLETED table is showing, grouped. */
async function allRows(){
