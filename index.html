const numv=v=>{const n=parseFloat(String(v==null?"":v).replace(/[$,\s]/g,""));return isNaN(n)?0:n;};

/* Clicking a group drills into estimated-value bands within it. Everything is
   already in the browser from allRows(), so this needs no extra query. */
const EV_BANDS=[
  {k:"$0 – $24",     lo:0,   hi:25},
  {k:"$25 – $99",    lo:25,  hi:100},
  {k:"$100 – $499",  lo:100, hi:500},
  {k:"$500 or more", lo:500, hi:Infinity}
];
const bandOf=v=>{
  if(v===null||v===undefined||v==="") return "(no est value)";
  const n=numv(v);
  const b=EV_BANDS.find(x=>n>=x.lo&&n<x.hi);
  return b?b.k:EV_BANDS[0].k;
};
let BRK={value:null};   // the group being drilled into, or null

/* one row of totals for a set of lots */
function brkAgg(rows,keyOf){
  const g=new Map();
  rows.forEach(r=>{
    const k=keyOf(r);
    let o=g.get(k);
    if(!o){ o={k,lots:0,cost:0,sold:0,soldCount:0,costOfSold:0,bids:0}; g.set(k,o); }
    o.lots++; o.cost+=numv(r.PURCHASE_COST); o.bids+=numv(r.TOTAL_BIDS);
    const sp=numv(r.SOLD_PRICE);
    if(sp){ o.sold+=sp; o.soldCount++; o.costOfSold+=numv(r.PURCHASE_COST); }
  });
  return [...g.values()].map(o=>({...o,
    profit:o.sold-o.costOfSold,
    margin:o.sold?((o.sold-o.costOfSold)/o.sold)*100:null,
    avg:o.soldCount?o.sold/o.soldCount:0
  }));
}

function brkTable(list,firstHeader,clickable){
  const head=["","LOTS","SOLD #","COST","SOLD","PROFIT","MARGIN","AVG SOLD","BIDS"];
  $("#brkTbl thead").innerHTML="<tr>"+head.map((h,i)=>
    `<th${i?' style="text-align:right"':""}>${h||esc(firstHeader)}</th>`).join("")+"</tr>";
  $("#brkTbl tbody").innerHTML=list.map(o=>`<tr${clickable?` data-k="${esc(o.k)}" style="cursor:pointer"`:""}>
      ${firstHeader==="SPORT"?sportCell(o.k).replace("<td>","<td class=\"wrap\">"):`<td class="wrap">${esc(o.k)}</td>`}
      <td class="num">${fmt(o.lots)}</td>
      <td class="num">${fmt(o.soldCount)}</td>
      <td class="num">${usd(o.cost)}</td>
      <td class="num">${usd(o.sold)}</td>
      <td class="num ${o.profit>=0?"pos":"neg"}">${usd(o.profit)}</td>
      <td class="num ${o.margin>=0?"pos":"neg"}">${pct(o.margin)}</td>
      <td class="num">${usd(o.avg)}</td>
      <td class="num">${fmt(o.bids)}</td></tr>`).join("");
  const T=list.reduce((a,o)=>({lots:a.lots+o.lots,soldCount:a.soldCount+o.soldCount,cost:a.cost+o.cost,
    sold:a.sold+o.sold,costOfSold:a.costOfSold+o.costOfSold,bids:a.bids+o.bids}),
    {lots:0,soldCount:0,cost:0,sold:0,costOfSold:0,bids:0});
  const tp=T.sold-T.costOfSold, tm=T.sold?(tp/T.sold)*100:null;
  $("#brkTbl tfoot").innerHTML=`<tr style="border-top:2px solid var(--line)">
    <td><b>TOTAL</b></td><td class="num"><b>${fmt(T.lots)}</b></td><td class="num"><b>${fmt(T.soldCount)}</b></td>
    <td class="num"><b>${usd(T.cost)}</b></td><td class="num"><b>${usd(T.sold)}</b></td>
    <td class="num ${tp>=0?"pos":"neg"}"><b>${usd(tp)}</b></td>
    <td class="num ${tm>=0?"pos":"neg"}"><b>${pct(tm)}</b></td>
    <td class="num">&mdash;</td><td class="num"><b>${fmt(T.bids)}</b></td></tr>`;
  if(clickable){
    $$("#brkTbl tbody tr[data-k]").forEach(tr=>tr.onclick=()=>{ BRK.value=tr.dataset.k; renderBreak(); });
  }
}

async function renderBreak(){
  const col=$("#grpBy").value;
  const label=col.replace(/_/g," ");
  const job=startLoad("breakdown","Grouping the book");
  try{
    const rows=await allRows();
    endLoad(job);
    const keyOf=r=>r[col]==null||r[col]===""?"\u2014":String(r[col]);

    if(BRK.value===null){
      $("#brkCrumb").classList.add("hidden");
      const list=brkAgg(rows,keyOf).sort((a,b)=>b.sold-a.sold);
      brkTable(list,label,true);
      $("#brkNote").textContent=`${fmt(rows.length)} lots grouped into ${fmt(list.length)} ${label.toLowerCase()} values. Click a row to break it down by estimated value. Filters from the COMPLETED AUCTIONS tab apply.`;
      return;
    }

    /* drilled in: the same totals, bucketed by estimated value */
    const subset=rows.filter(r=>keyOf(r)===BRK.value);
    $("#brkCrumb").classList.remove("hidden");
    $("#brkCrumbTitle").innerHTML=`${esc(BRK.value)} <span class="q">${label} &middot; ${fmt(subset.length)} LOTS</span>`;
    const byBand=brkAgg(subset,r=>bandOf(r.ESTIMATED_VALUE));
    const order=EV_BANDS.map(b=>b.k).concat("(no est value)");
    const list=order.map(k=>byBand.find(o=>o.k===k)
      ||{k,lots:0,cost:0,sold:0,soldCount:0,costOfSold:0,bids:0,profit:0,margin:null,avg:0})
      .filter(o=>o.lots>0||o.k!=="(no est value)");
    brkTable(list,"EST VALUE",false);
    $("#brkNote").textContent=`${fmt(subset.length)} ${BRK.value} lots by estimated value. Bands are the card's estimated value, not what it sold for.`;
  }catch(e){
    endLoad(job,false);
    $("#msg").innerHTML='<div class="err">Could not build the breakdown &mdash; '+esc(e.message)+'</div>';
  }
}

/* Export the tab you are looking at, as .xlsx.
   CSV handed Google Sheets plain text and let it guess — which turned the
   7-digit card numbers and the ISO timestamps into whatever it felt like.
   Writing a real workbook keeps numbers numeric and dates as dates, so the
   file opens in Sheets already typed. */
const DATE_FIELDS=["SOLD_AT","START_AT","END_AT"];
async function exportXlsx(){
  const job=startLoad("export","Building the spreadsheet");
  try{
    const onPipe = currentPage==="pipe";
    const rows = onPipe ? await pAllRows() : await allRows();
    endLoad(job);
    if(!rows.length){ $("#msg").innerHTML='<div class="err">Nothing to export with these filters.</div>'; return; }

    const typed = rows.map(r=>{
      const o={};
      Object.keys(r).forEach(k=>{
        let v=r[k];
        if(v!==null&&v!==undefined&&v!==""&&DATE_FIELDS.includes(k)){
          const t=Date.parse(v); if(!isNaN(t)) v=new Date(t);
        }
        o[k]=v;
      });
      return o;
    });

    const sheetName = onPipe ? ((P.cat==="card"?"Cards ":"Watches ")+(P.view==="active"?"in auction":"waiting")) : "Completed auctions";
    const ws = XLSX.utils.json_to_sheet(typed);
    ws["!cols"] = Object.keys(typed[0]).map(k=>({wch:Math.min(38,Math.max(10,k.length+2))}));
    ws["!autofilter"] = {ref: ws["!ref"]};
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    const stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `arena-${onPipe?P.cat+"-"+P.view:"completed"}-${stamp}.xlsx`);
  }catch(e){
    endLoad(job,false);
    $("#msg").innerHTML='<div class="err">Export failed — '+esc(e.message)+'</div>';
  }
}

   columns — the saved choice is still its own, keyed by category */

function pCell(row,c){
  const v=row[c.k];
  if(c.kind==="sec"){
    const name=String(v||"");
    const cls=/shoebox/i.test(name)?"shoebox":/auction/i.test(name)?"auctions":"";
    return `<td><span class="sec ${cls}">${esc(name||"—")}</span></td>`;
  }
  if(c.kind==="view"){
    return v?`<td><a class="alink" href="${esc(v)}" target="_blank" rel="noopener">VIEW ↗</a></td>`:`<td></td>`;
  }
  if(c.kind==="admin"){
    return v?`<td><a class="alink" style="opacity:.62" href="${esc(v)}" target="_blank" rel="noopener">ADMIN ↗</a></td>`:`<td></td>`;
  }
  /* A live lot has no sale price, so margin is measured against the current
     bid — what it would make if it closed now. Waiting lots have no bid at
     all, so those measure against estimated value. Both columns are labelled
     so neither reads as a settled figure. */
  if(c.kind==="plbid"||c.kind==="mgnbid"){
    const cost=numv(row.PURCHASE_COST), bid=numv(row.CURRENT_BID);
    if(!bid) return `<td class="num" title="no bids yet">—</td>`;
    const n=c.kind==="plbid" ? bid-cost : ((bid-cost)/bid)*100;
    const txt=c.kind==="plbid" ? usdc(n) : pct(n);
    return `<td class="num ${n>0?"pos":n<0?"neg":""}">${txt}</td>`;
  }
  if(c.kind==="mgnev"){
    const cost=numv(row.PURCHASE_COST), ev=numv(row.ESTIMATED_VALUE);
    if(!ev) return `<td class="num" title="no estimated value">—</td>`;
    const n=((ev-cost)/ev)*100;
    return `<td class="num ${n>0?"pos":n<0?"neg":""}">${pct(n)}</td>`;
  }
  if(c.kind==="hrs"){
    if(v===null||v===undefined||v==="") return `<td class="num">—</td>`;
    const n=Number(v);
    return `<td class="num ${n<=24?"soon":""}">${n<0?"ended":fmt(n)+"h"}</td>`;
  }
  return cell(row,c);
}

async function pBook(){
  const key=pKey();
  if(P.books[key]) return P.books[key];
  /* the section pills ask for this in the background while the first page is
     already on screen, and a click on one asks again — both wait on the one
     request rather than starting a second */
  if(!P.loading[key]){
    P.loading[key]=bookPages(PAPI,{view:P.view,category:apiCat()})
      .then(book=>{
        P.books[key]=book;
        buildFields(pScope(),book.columns,book.rows);
        return book;
      })
      .finally(()=>{ delete P.loading[key]; });
  }
  return P.loading[key];
}

async function loadPipe(){
  if(!PAPI){
    $("#msg").innerHTML='<div class="err">The pipeline needs its own serverless function, which a static local server can\u2019t run — open the deployed site to use this tab.</div>';
    return;
  }
  /* already here — switching back is instant */
  if(P.books[pKey()]){ applyPipe(); return; }
  /* Each of these is one request: the largest view is 2,273 rows and a page
     holds 4,000. Fetching a view whole, once, costs no more than the page it
     used to fetch every single time a pill was clicked — and every switch
     after that is answered from memory. Cards and premier auctions share a
     book, so moving between those two never asks for anything at all. */
  const job = startLoad("pipe:book:"+pKey(),"Loading "+pWhat());
  try{
    await pBook();
    applyPipe();
    endLoad(job);
  }catch(e){
    endLoad(job,false);
    $("#msg").innerHTML='<div class="err">Could not load the pipeline — '+esc(e.message)+'</div>';
  }
}

function applyPipe(){
  const book=P.books[pKey()]; if(!book) return;
  const all=P.cat==="premier"?book.rows.filter(inPremier):book.rows;
  const rows=sortRows(filterRows(all,pScope()),P.sort,P.dir);
  const pages=Math.max(1,Math.ceil(rows.length/100));
  if(P.page>pages) P.page=pages;
  const b={ok:true,rows:rows.slice((P.page-1)*100,P.page*100),columns:book.columns,
    matched:rows.length,total:all.length,pages,
    totals:pTotalsJS(rows,P.view),generated:book.generated};
  P.meta=b;
  syncFilterUI(pScope(),"#pipeFilt","#pipeChips",()=>{P.page=1;loadPipe();});
  pKpis(b); pTable(b);
}

/* api/pipeline.js totals(), moved here for the same reason as the book: the
   rows being totalled are the filtered ones. */
function pTotalsJS(rows,view){
  const sum=k=>rows.reduce((a,r)=>a+numv(r[k]),0);
  const base={count:rows.length,est_value:sum("ESTIMATED_VALUE"),cost:sum("PURCHASE_COST")};
  if(view==="active"){
    const bid=sum("CURRENT_BID");
    const withBids=rows.filter(r=>numv(r.TOTAL_BIDS)>0).length;
    return Object.assign(base,{
      pl_at_bid:bid-base.cost,
      margin_at_bid:bid?((bid-base.cost)/bid)*100:null,
      current_bid:bid, start_price:sum("START_PRICE"), bids:sum("TOTAL_BIDS"),
      with_bids:withBids, no_bids:rows.length-withBids,
      closing_24h:rows.filter(r=>numv(r.HOURS_LEFT)>=0&&numv(r.HOURS_LEFT)<=24).length
    });
  }
  return Object.assign(base,{
    relists:rows.filter(r=>numv(r.PAST_AUCTIONS)>0).length,
    margin_at_ev:base.est_value?((base.est_value-base.cost)/base.est_value)*100:null
  });
}

async function pCounts(){
  if(!PAPI) return;
  const set=(id,v)=>{ const el=$(id); if(el) el.textContent=v; };
  const fill=(view,val)=>{
    set(view==="active"?"#pillActive":"#pillWaiting", val);
    if(view==="active") set("#pipeTabCount", val);
  };
  /* The open view's count is already loaded — use it rather than asking again,
     so this only fetches the other one. Three cold requests at once was both
     wasteful and the likeliest way to get a failure. */
  if(P.meta&&P.meta.ok) fill(P.view, fmt(P.meta.total));
  const other = P.view==="active" ? "waiting" : "active";
  /* if that view has been read already, its count is in memory */
  const book=P.books[apiCat()+":"+other];
  if(book){
    fill(other, fmt((P.cat==="premier"?book.rows.filter(inPremier):book.rows).length));
    return;
  }
  try{
    const q=new URLSearchParams({view:other,category:apiCat(),limit:"1"});
    if(P.cat==="premier") q.set("COLLECTION",PREMIER_SEC);
    const r=await fetch(PAPI+"?"+q.toString());
    const b=await readJson(r);
    if(!b.ok) throw new Error(b.error||"no data");
    fill(other, fmt(P.cat==="premier"?b.matched:b.total));
  }catch(_){
    /* show that it is unknown — a stale 0 reads as a real count */
    fill(other,"—");
  }
}

function pKpis(b){
  const t=b.totals||{}, filtered=(b.matched||0)!==(b.total||0);
  const tile=(k,v,s,cls)=>`<div class="kpi ${cls||""}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s||""}</div></div>`;
  const out=[];
  if(P.view==="active"){
    out.push(tile("IN AUCTION",fmt(t.count),filtered?`of ${fmt(b.total)} live`:"lots accepting bids"));
    out.push(tile("CLOSING < 24H",fmt(t.closing_24h),"finish today or tomorrow",t.closing_24h?"bad":""));
    out.push(tile("CURRENT BIDS",usd(t.current_bid),`${fmt(t.bids)} bids placed`,"good"));
    out.push(tile("NO BIDS YET",fmt(t.no_bids),"still at opening price",t.no_bids?"gold":""));
    out.push(tile("PURCHASE COST",usd(t.cost),"what these lots cost"));
    out.push(tile("P/L @ BID",usd(t.pl_at_bid),"if every lot closed now",t.pl_at_bid>=0?"good":"bad"));
    out.push(tile("MARGIN @ BID",pct(t.margin_at_bid),"bids minus cost ÷ bids",t.margin_at_bid>=0?"good":"bad"));
    out.push(tile("EST VALUE",usd(t.est_value),"book value on the block"));
  }else{
    out.push(tile("WAITING",fmt(t.count),filtered?`of ${fmt(b.total)} queued`:"in marketplace, not listed"));
    out.push(tile("EST VALUE",usd(t.est_value),"book value waiting","gold"));
    out.push(tile("PURCHASE COST",usd(t.cost),"what these lots cost"));
    out.push(tile("MARGIN @ EV",pct(t.margin_at_ev),"if each sold at estimate",t.margin_at_ev>=0?"good":"bad"));
    out.push(tile("RELISTS",fmt(t.relists),"ran before, back in queue"));
  }
  $("#pipeKpis").innerHTML=out.join("");
  const what=P.cat==="premier"?(P.view==="active"?"PREMIER, LIVE":"PREMIER, WAITING")
                              :(P.view==="active"?"LIVE LOTS":"WAITING");
  $("#pipeHead")&&($("#pipeHead").textContent=what+" · "+fmt(b.matched)+(filtered?` of ${fmt(b.total)}`:""));
  $("#mGen").textContent=stamp(b.generated);
}

function pTable(b){
  const avail=b.columns||[];
  const defs=PCOLS[P.cat][P.view].filter(c=>c.always||!b.columns||avail.includes(c.k));
  const cols=visibleCols("pipe:"+P.cat+":"+P.view,defs,avail);
  /* pinning a column only reads as pinning while it is at the left edge —
     dragged into the middle it would slide over its neighbours instead */
  const stickKey=(cols.slice(0,2).find(c=>c.kind==="wrap")||{}).k;
  $("#pipeTbl thead").innerHTML="<tr>"+cols.map(c=>{
    const on=P.sort===c.k;
    const cls=c.k===stickKey?' class="stick"':"";
    return `<th${cls} ${c.nosort?"":`data-k="${c.k}"`}>${esc(c.t)}${on?`<span class="ar">${P.dir==="asc"?"▲":"▼"}</span>`:""}</th>`;
  }).join("")+"</tr>";
  $("#pipeTbl tbody").innerHTML=b.rows.length
    ? b.rows.map(r=>"<tr>"+cols.map(c=>stickify(pCell(r,c),c.k===stickKey)).join("")+"</tr>").join("")
    : `<tr><td colspan="${cols.length}" style="padding:24px;text-align:center;color:var(--muted)">Nothing matches these filters.</td></tr>`;
  $$("#pipeTbl th[data-k]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(P.sort===k) P.dir=P.dir==="asc"?"desc":"asc"; else { P.sort=k; P.dir="desc"; }
    P.page=1; loadPipe();
  });
  pager($("#pipePager"),P.page,b.pages||1,b.matched||0,pg=>{P.page=pg;loadPipe();});
}

/* Clicking a pill used to highlight it and then leave the last selection's
   tiles and rows sitting underneath until the request came back — watches
   showing 1,292 cards for a second reads as a broken page rather than a
   loading one. Clear what is now wrong; the loading card says what is
   coming. Nothing is cleared when the answer is already in memory, so an
   instant switch does not flicker. */
/* The two view counts describe a category, so they are wrong the moment
   another one is picked — even when its rows are already in memory and the
   switch is instant. */
function pBlankCounts(){
  ["#pillActive","#pillWaiting","#pipeTabCount"].forEach(id=>{
    const el=$(id); if(el) el.textContent="—";
  });
}
function pClear(){
  const k=$("#pipeKpis"); if(k) k.innerHTML="";
  const t=$("#pipeTbl");
  if(t){ t.querySelector("thead").innerHTML=""; t.querySelector("tbody").innerHTML=""; }
  const pg=$("#pipePager"); if(pg) pg.innerHTML="";
  const h=$("#pipeHead"); if(h) h.textContent=pWhat().toUpperCase();
  pBlankCounts();
  /* the filter chips belong to the category that just left too: each of
     these tables keeps its own rules, so show the new one's straight away */
  syncFilterUI(pScope(),"#pipeFilt","#pipeChips",()=>{P.page=1;loadPipe();});
}
$$(".pill-btn[data-cat]").forEach(btn=>btn.onclick=()=>{
  if(btn.classList.contains("on")) return;
  $$(".pill-btn[data-cat]").forEach(x=>x.classList.remove("on")); btn.classList.add("on");
  P.cat=btn.dataset.cat; P.page=1; P.sort="";
  P.books[pKey()] ? pBlankCounts() : pClear();
  loadPipe().then(pCounts);
});

$$(".pill-btn[data-pv]").forEach(btn=>btn.onclick=()=>{
  if(btn.classList.contains("on")) return;
  $$(".pill-btn[data-pv]").forEach(x=>x.classList.remove("on")); btn.classList.add("on");
  P.view=btn.dataset.pv; P.page=1; P.sort="";
  if(!P.books[pKey()]) pClear();
  loadPipe().then(pCounts);
});
$("#pipeFilt").onclick=async e=>{
  e.stopPropagation();
  const job=startLoad("pipe:book:"+pKey(),"Reading the whole pipeline to filter it");
  try{ await pBook(); endLoad(job); }
  catch(err){ endLoad(job,false); $("#msg").innerHTML='<div class="err">Could not read the pipeline — '+esc(err.message)+'</div>'; return; }
  openFilterPanel(pScope(), (P.cat==="card"?"CARDS":"WATCHES")+" "+(P.view==="active"?"IN AUCTION":"WAITING"),
                  ()=>{ P.page=1; applyPipe(); });
};


$("#lotCols").onclick=(e)=>{
  e.stopPropagation();
  const b=S.meta||{};
  openColumnPicker("completed", COLS.filter(c=>c.always||!b.columns||(b.columns||[]).includes(c.k)||c.k===""),
                   (b.columns||[]).concat(EXTRA_CARD_FIELDS),
                   ()=>renderTable(S.meta));
};
$("#pipeCols").onclick=(e)=>{
  e.stopPropagation();
  const b=P.meta||{};
  openColumnPicker("pipe:"+P.cat+":"+P.view,
                   PCOLS[P.cat][P.view].filter(c=>c.always||!b.columns||(b.columns||[]).includes(c.k)),
                   b.columns||[], ()=>pTable(P.meta));
};


/* ---------- column picker ----------
   Each table has a default set; everything else the endpoint returns can be
   switched on. Choices persist per table in localStorage, wrapped because it
   throws in private windows. A column the endpoint stops returning simply
   disappears rather than rendering an empty column. */
const COLPREF_KEY = k => "cols:" + k;
function colPref(key){
  try{ const v=localStorage.getItem(COLPREF_KEY(key)); return v?JSON.parse(v):null; }
  catch(_){ return null; }
}
function setColPref(key,list){
  try{ localStorage.setItem(COLPREF_KEY(key), JSON.stringify(list)); }catch(_){}
}
/* A choice made before columns could be dragged carries no order of its own,
   so it still gets the derived one. Once a table has been arranged by hand
   this flag says so, and the saved list is taken literally. */
const COLORD_KEY = k => "colorder:" + k;
function colOrdered(key){
  try{ return localStorage.getItem(COLORD_KEY(key))==="1"; }catch(_){ return false; }
}
function setColOrdered(key,on){
  try{ on ? localStorage.setItem(COLORD_KEY(key),"1") : localStorage.removeItem(COLORD_KEY(key)); }catch(_){}
}
/* readable label for a column the picker offers but no table defines */
const niceName = k => k.replace(/_/g," ").replace(/\bAC NUMBER\b/,"AC #")
  .replace(/\bCARD NUMBER\b/,"CARD #").replace(/\bIS /,"");

/* visible columns = the saved choice, else the table's defaults.
   Newly switched-on fields would otherwise land wherever the picker listed
   them — after VIEW and ADMIN, off the right edge past the scroll, which looks
   exactly like nothing happened. So the thumbnail stays first and the link
   columns are forced last, with everything else in between. */
const LINK_KINDS=/^(view|admin|viewcalc|link)$/;
function orderCols(cols){
  const img=cols.filter(c=>c.kind==="img");
  const links=cols.filter(c=>LINK_KINDS.test(c.kind||""));
  const rest=cols.filter(c=>c.kind!=="img" && !LINK_KINDS.test(c.kind||""));
  return img.concat(rest, links);
}
function visibleCols(key, defs, available){
  const saved=colPref(key);
  if(!saved) return orderCols(defs);
  const byKey={}; defs.forEach(c=>byKey[c.k]=c);
  const picked=saved
    .filter(k=>byKey[k] || (available||[]).includes(k))
    .map(k=>byKey[k] || {k, t:niceName(k)});
  return colOrdered(key) ? picked : orderCols(picked);
}

function openColumnPicker(key, defs, available, onApply){
  const shown=new Set(visibleCols(key,defs,available).map(c=>c.k));
  const defKeys=defs.map(c=>c.k);
  /* defaults first, then anything else the endpoint returns */
  const extras=(available||[]).filter(k=>!defKeys.includes(k) && !/^(PUBLIC_URL|ADMIN_URL|CARD_URL|AUCTION_URL|FRONT_SLAB_PICTURE_URL|AUCTION_ID|ITEM_ID|IS_SHOEBOX)$/.test(k));
  const all=defKeys.concat(extras.filter(k=>!defKeys.includes(k)));
  /* the list reads top to bottom the way the table reads left to right, so
     what you drag here is what moves there */
  const saved=colPref(key)||[];
  const order=saved.filter(k=>all.includes(k)).concat(all.filter(k=>!saved.includes(k)));
  const labelOf=k=>((defs.find(c=>c.k===k)||{}).t)||niceName(k)||k;
  let moved=false;

  const wrap=document.createElement("div");
  /* deliberately NOT .mselpanel.open: the document-level handler that dismisses
     filter dropdowns strips .open from every panel, and the opening click
     bubbles up to it. Own class, explicit display. */
  wrap.className="mselpanel colpick";
  wrap.style.cssText="display:block;position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(408px,94vw);max-height:76vh;overflow:auto;z-index:200";
  wrap.innerHTML=`<div style="letter-spacing:1.5px;font-size:11px;color:var(--muted);margin-bottom:4px">CHOOSE COLUMNS</div>
    <p class="note" style="margin:0 0 8px">Tick what to show. Drag a row, or use ↑ ↓, to set the order.</p>
    <div class="mselopts colsort" style="max-height:52vh">${order.map(k=>
      `<div class="mselopt colrow" draggable="true" data-k="${esc(k)}">
        <span class="grip" title="drag to reorder">⠿</span>
        <label class="cpick" title="${esc(labelOf(k))}"><input type="checkbox" value="${esc(k)}" ${shown.has(k)?"checked":""}>
          <span>${esc(labelOf(k))}</span></label>
        <span class="mv"><button type="button" data-mv="up" title="move up">↑</button><button type="button" data-mv="down" title="move down">↓</button></span>
      </div>`).join("")}</div>
    <div class="mselfoot">
      <button class="btn ghost" data-act="reset">RESET</button>
      <button class="btn" data-act="done">DONE</button>
    </div>`;
  const list=wrap.querySelector(".colsort");

  /* --- drag to reorder --- */
  list.addEventListener("dragstart",e=>{
    const row=e.target.closest(".colrow"); if(!row) return;
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed="move";
    /* Firefox will not start a drag without something on the clipboard */
    try{ e.dataTransfer.setData("text/plain",row.dataset.k); }catch(_){}
  });
  list.addEventListener("dragend",()=>{
    const row=list.querySelector(".dragging"); if(row) row.classList.remove("dragging");
  });
  list.addEventListener("dragover",e=>{
    e.preventDefault();
    const row=list.querySelector(".dragging"); if(!row) return;
    const over=e.target.closest(".colrow");
    if(!over||over===row) return;
    const box=over.getBoundingClientRect();
    /* past halfway down the row it goes below, so the gap follows the cursor */
    const below=(e.clientY-box.top)>box.height/2;
    list.insertBefore(row, below?over.nextSibling:over);
    moved=true;
  });
  list.addEventListener("drop",e=>e.preventDefault());

  /* --- and the same move without a mouse --- */
  list.addEventListener("click",e=>{
    const b=e.target.closest("[data-mv]"); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    const row=b.closest(".colrow");
    if(b.dataset.mv==="up"&&row.previousElementSibling) list.insertBefore(row,row.previousElementSibling);
    else if(b.dataset.mv==="down"&&row.nextElementSibling) list.insertBefore(row.nextElementSibling,row);
    else return;
    moved=true;
    row.scrollIntoView({block:"nearest"});
  });

  const shade=document.createElement("div");
  shade.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:199";
  const close=()=>{ wrap.remove(); shade.remove(); };
  shade.onclick=e=>{ e.stopPropagation(); close(); };
  wrap.onclick=e=>{
    e.stopPropagation();
    const act=e.target.dataset&&e.target.dataset.act;
    if(act==="reset"){
      setColPref(key,null); setColOrdered(key,false);
      try{localStorage.removeItem(COLPREF_KEY(key));}catch(_){}
      close(); onApply();
    }
    if(act==="done"){
      const rows=[...list.querySelectorAll(".colrow")];
      const picked=rows.filter(r=>r.querySelector("input").checked).map(r=>r.dataset.k);
      /* an order is only kept once one has been set by hand; until then the
         table keeps deciding where a newly ticked column belongs */
      if(moved) setColOrdered(key,true);
      setColPref(key, picked.length?picked:defKeys);
      close(); onApply();
    }
  };
  document.body.appendChild(shade); document.body.appendChild(wrap);
}

/* ---------- page switching ---------- */
let currentPage="lots";
$$(".tab[data-page]").forEach(b=>b.onclick=()=>{
  $$(".tab[data-page]").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  const pg=b.dataset.page; currentPage=pg;
  $("#page-lots").classList.toggle("hidden",pg!=="lots");
  $("#page-break").classList.toggle("hidden",pg!=="break");
  $("#page-pipe").classList.toggle("hidden",pg!=="pipe");
  if(pg==="break") renderBreak();
  if(pg==="pipe"){ loadPipe().then(pCounts); }
});

/* ---------- wiring ---------- */
$("#lotFilt").onclick=async e=>{
  e.stopPropagation();
  /* the whole book first: a rule that only saw the hundred rows on screen
     would be answering a different question than the one it asks */
  const job=startLoad("lots:book","Reading the whole book to filter it");
  try{ await ensureBook(); endLoad(job); }
  catch(err){ endLoad(job,false); $("#msg").innerHTML='<div class="err">Could not read the book — '+esc(err.message)+'</div>'; return; }
  openFilterPanel("lots","COMPLETED AUCTIONS",()=>{
    S.page=1; load();
    if(currentPage==="break") renderBreak();
  });
};
$("#reload").onclick=async()=>{
  FORCE_FRESH=true;
  const btn=$("#reload"), label=btn.textContent;
  btn.disabled=true; btn.textContent="REFRESHING…";
  try{
    S.book=null; P.books={};
    if(currentPage==="pipe"){ await loadPipe(); pCounts(); }
    else { await load(); if(currentPage==="break") renderBreak(); }
  } finally {
    FORCE_FRESH=false; btn.disabled=false; btn.textContent=label;
  }
};
$("#csv").onclick=exportXlsx;
$("#grpBy").onchange=()=>{ BRK.value=null; renderBreak(); };
$("#brkBack").onclick=()=>{ BRK.value=null; renderBreak(); };
/* the design system styles .mark as clickable — send it to the first tab */
const logo=$("#homeLogo");
if(logo) logo.onclick=()=>$$('.tab[data-page="lots"]')[0].click();

load();
</script>
